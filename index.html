<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questionnaire Conners / Conners Questionnaire / استبيان كونرز</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,400;0,600;1,400&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap');

:root {
  --navy: #1a2744;
  --teal: #2d7d6f;
  --teal-light: #e8f4f1;
  --teal-mid: #c2e4de;
  --amber: #e8a020;
  --amber-light: #fef6e8;
  --red-soft: #c0392b;
  --red-light: #fdf0ef;
  --gray-50: #fafbfe;
  --gray-100: #f2f4f9;
  --gray-200: #e4e8f2;
  --gray-300: #c8cedf;
  --gray-400: #9aa3b8;
  --gray-600: #5a6478;
  --white: #fff;
  --shadow: 0 2px 10px rgba(26,39,68,.07);
  --shadow-lg: 0 6px 28px rgba(26,39,68,.13);
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', 'Noto Sans Arabic', sans-serif;
  background: var(--gray-100);
  color: var(--navy);
  min-height: 100vh;
  font-size: 15px;
}
body.rtl { font-family: 'Noto Sans Arabic', 'Inter', sans-serif; }

/* ── LANG BAR ── */
#lang-bar {
  background: var(--navy);
  padding: .45rem 1.2rem;
  display: flex; justify-content: flex-end; gap: .4rem; align-items: center;
}
.lang-btn {
  background: transparent;
  border: 1.5px solid rgba(255,255,255,.3);
  color: rgba(255,255,255,.7);
  font-family: inherit; font-size: .78rem; font-weight: 600;
  padding: .28rem .85rem; border-radius: 20px; cursor: pointer;
  transition: all .18s;
}
.lang-btn:hover, .lang-btn.active {
  background: var(--teal); border-color: var(--teal); color: #fff;
}

/* ── HEADER ── */
header {
  background: var(--navy); color: #fff;
  padding: 2rem 1.5rem 1.8rem; text-align: center;
  position: relative; overflow: hidden;
}
header::before { content:''; position:absolute; top:-50px; right:-50px; width:180px; height:180px; border-radius:50%; background:rgba(45,125,111,.22); }
header::after  { content:''; position:absolute; bottom:-35px; left:-35px; width:130px; height:130px; border-radius:50%; background:rgba(232,160,32,.16); }
header h1 { font-family:'Fraunces',serif; font-size:1.65rem; font-weight:600; letter-spacing:-.02em; position:relative; z-index:1; }
body.rtl header h1 { font-family:'Noto Sans Arabic',serif; letter-spacing:0; }
header p { margin-top:.4rem; font-size:.85rem; color:rgba(255,255,255,.65); position:relative; z-index:1; }
.badge { display:inline-block; margin-top:.6rem; background:var(--teal); color:#fff; font-size:.7rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:.28rem .85rem; border-radius:20px; position:relative; z-index:1; }
body.rtl .badge { letter-spacing:0; text-transform:none; }

/* ── STICKY PROGRESS ── */
#progress-wrap {
  position:sticky; top:0; z-index:200;
  background:var(--white); box-shadow:var(--shadow);
  padding:.55rem 1.2rem; display:flex; align-items:center; gap:.9rem;
}
#progress-label { font-size:.78rem; color:var(--gray-600); white-space:nowrap; min-width:90px; }
#progress-bar-outer { flex:1; height:7px; background:var(--gray-200); border-radius:8px; overflow:hidden; }
#progress-bar-inner { height:100%; width:0%; background:linear-gradient(90deg,var(--teal),var(--amber)); border-radius:8px; transition:width .35s ease; }
#progress-pct { font-size:.8rem; font-weight:700; color:var(--teal); white-space:nowrap; }

/* missing-item alert banner */
#missing-banner {
  display:none;
  position:sticky; top:42px; z-index:190;
  background:#fff3cd; border-bottom:2px solid var(--amber);
  padding:.5rem 1.2rem;
  font-size:.82rem; font-weight:600; color:#7a5500;
  display:none; align-items:center; gap:.6rem; flex-wrap:wrap;
}
.missing-chip {
  display:inline-flex; align-items:center; gap:.3rem;
  background:var(--amber); color:#fff;
  border-radius:20px; padding:.18rem .65rem;
  font-size:.75rem; font-weight:700; cursor:pointer;
  transition: opacity .15s;
}
.missing-chip:hover { opacity:.82; }

/* ── MAIN ── */
main { max-width:820px; margin:0 auto; padding:1rem .5rem 3rem; }
@media(min-width:600px){ main { padding:1.6rem 1rem 4rem; } }

/* ── CARD ── */
.card {
  background:var(--white); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:.9rem .85rem; margin-bottom:1rem;
}
@media(min-width:600px){ .card { padding:1.5rem 1.5rem; margin-bottom:1.4rem; } }
.card-title {
  font-family:'Fraunces',serif; font-size:1rem; color:var(--navy);
  border-left:4px solid var(--teal); padding-left:.7rem; margin-bottom:1.1rem;
}
body.rtl .card-title { font-family:'Noto Sans Arabic',serif; border-left:none; border-right:4px solid var(--teal); padding-left:0; padding-right:.7rem; }

/* ── INFO GRID ── */
.info-grid { display:grid; grid-template-columns:1fr 1fr; gap:.85rem; }
@media(max-width:520px){ .info-grid{ grid-template-columns:1fr; } }
.field-label { display:block; font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--gray-600); margin-bottom:.28rem; }
body.rtl .field-label { text-transform:none; letter-spacing:0; }
input[type=text], input[type=email], input[type=date], select {
  width:100%; border:1.5px solid var(--gray-200); border-radius:8px;
  padding:.52rem .8rem; font-family:inherit; font-size:.88rem; color:var(--navy);
  background:var(--gray-50); outline:none; transition:border-color .18s,background .18s;
}
input:focus, select:focus { border-color:var(--teal); background:var(--white); }

/* ── INSTRUCTIONS ── */
.instructions {
  background:var(--amber-light); border-left:4px solid var(--amber);
  border-radius:0 10px 10px 0; padding:.9rem 1.1rem;
  margin-bottom:1.4rem; font-size:.87rem; line-height:1.65;
}
body.rtl .instructions { border-left:none; border-right:4px solid var(--amber); border-radius:10px 0 0 10px; }
.scale-legend { display:flex; gap:.5rem; flex-wrap:wrap; margin-top:.7rem; }
.scale-chip { display:flex; align-items:center; gap:.35rem; font-size:.78rem; font-weight:600; background:var(--white); border:1.5px solid var(--gray-200); border-radius:20px; padding:.22rem .75rem; }
.chip-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }

/* ── SECTION HEADER ── */
.section-hdr {
  display:flex; align-items:center; gap:.7rem; margin:1.5rem 0 .6rem;
}
.section-hdr::before, .section-hdr::after { content:''; flex:1; height:1px; background:var(--gray-200); }
.section-hdr span { font-size:.68rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--teal); white-space:nowrap; }
body.rtl .section-hdr span { letter-spacing:0; text-transform:none; }

/* ════════════════════════════════════════
   QUESTION ROW — compact, 2-line max text
   ════════════════════════════════════════ */
/* ── 5 alternating row colours (odd/even within each band of 5) ── */
:root {
  --c0-bg:#f0f4ff; --c0-left:#7b9fd4; --c0-num:#4a7abf;
  --c1-bg:#f0f9f4; --c1-left:#6bbf8a; --c1-num:#3d9e6a;
  --c2-bg:#fff7ed; --c2-left:#f0a045; --c2-num:#c97c10;
  --c3-bg:#fdf0f7; --c3-left:#d47bb5; --c3-num:#b0508e;
  --c4-bg:#f2f0ff; --c4-left:#8b79d4; --c4-num:#6553b8;
}

.q-row {
  display:flex;
  align-items:center;
  gap:.55rem;
  padding:.5rem .5rem .5rem .0rem;
  border-radius:9px;
  margin-bottom:3px;
  border-left:4px solid transparent;
  transition:filter .12s, opacity .12s;
  position:relative;
}
/* Alternating colour bands */
.q-row.c0 { background:var(--c0-bg); border-left-color:var(--c0-left); }
.q-row.c1 { background:var(--c1-bg); border-left-color:var(--c1-left); }
.q-row.c2 { background:var(--c2-bg); border-left-color:var(--c2-left); }
.q-row.c3 { background:var(--c3-bg); border-left-color:var(--c3-left); }
.q-row.c4 { background:var(--c4-bg); border-left-color:var(--c4-left); }

/* When answered — keep colour but add a subtle check overlay */
.q-row.answered { opacity:1; }
.q-row.answered::after {
  content:'✓';
  position:absolute; right:.45rem; top:50%; transform:translateY(-50%);
  font-size:.65rem; font-weight:800;
  color:var(--teal); opacity:.55;
  pointer-events:none;
}
body.rtl .q-row.answered::after { right:auto; left:.45rem; }

.q-row.missing-highlight {
  background:#fff3cd !important;
  border-left-color:var(--amber) !important;
  border:2px solid var(--amber) !important;
  border-radius:9px;
  animation:pulse-warn 1.2s ease infinite;
}
@keyframes pulse-warn {
  0%,100% { box-shadow: 0 0 0 2px rgba(232,160,32,.5); }
  50%      { box-shadow: 0 0 0 7px rgba(232,160,32,.15); }
}

/* number badge */
.q-num {
  flex-shrink:0;
  width:24px; height:24px;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%;
  font-size:.67rem; font-weight:800;
  margin-left:.35rem;
}
.q-row.c0 .q-num { background:var(--c0-num); color:#fff; }
.q-row.c1 .q-num { background:var(--c1-num); color:#fff; }
.q-row.c2 .q-num { background:var(--c2-num); color:#fff; }
.q-row.c3 .q-num { background:var(--c3-num); color:#fff; }
.q-row.c4 .q-num { background:var(--c4-num); color:#fff; }
.q-row.missing-highlight .q-num { background:var(--amber) !important; color:#fff; }
body.rtl .q-num { margin-left:0; margin-right:.35rem; }

/* question text — strict 2 lines, full text on tap/hover */
.q-text {
  flex:1;
  font-size:.82rem;
  line-height:1.38;
  color:var(--navy);
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  min-width:0;
  cursor:default;
}
/* Reveal full text on interaction — but only for this row */
.q-row:hover .q-text,
.q-row:focus-within .q-text {
  -webkit-line-clamp:unset;
  overflow:visible;
}

/* rating buttons — 4 small squares, never wrap */
.rating-group {
  flex-shrink:0;
  display:flex;
  gap:.22rem;
  align-items:center;
}
.rating-group input[type=radio] { display:none; }
.rating-group label {
  width:36px; height:36px;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  border-radius:7px;
  border:1.5px solid var(--gray-300);
  cursor:pointer;
  transition:all .13s;
  user-select:none;
  flex-shrink:0;
}
.rating-group label .r-val {
  font-size:.85rem; font-weight:700; color:var(--gray-400); line-height:1;
}
.rating-group label .r-lbl {
  font-size:.48rem; font-weight:600; color:var(--gray-400);
  margin-top:1px; text-align:center; line-height:1;
  white-space:nowrap; display:none;
}
/* Show text labels only on larger screens */
@media(min-width:680px){
  .rating-group label { width:54px; height:42px; }
  .rating-group label .r-lbl { display:block; }
  .q-text { font-size:.88rem; }
}
.rating-group label:hover { border-color:var(--teal); }
.rating-group label:hover .r-val,
.rating-group label:hover .r-lbl { color:var(--teal); }

/* checked states */
.rating-group input[value="0"]:checked + label { background:#5d8cc4; border-color:#5d8cc4; }
.rating-group input[value="1"]:checked + label { background:#5aab6d; border-color:#5aab6d; }
.rating-group input[value="2"]:checked + label { background:var(--amber); border-color:var(--amber); }
.rating-group input[value="3"]:checked + label { background:var(--red-soft); border-color:var(--red-soft); }
.rating-group input:checked + label .r-val,
.rating-group input:checked + label .r-lbl { color:#fff; }

/* RTL adjustments */
body.rtl .q-row { flex-direction:row-reverse; border-left:none; border-right:4px solid transparent; }
body.rtl .q-row.c0 { border-right-color:var(--c0-left); }
body.rtl .q-row.c1 { border-right-color:var(--c1-left); }
body.rtl .q-row.c2 { border-right-color:var(--c2-left); }
body.rtl .q-row.c3 { border-right-color:var(--c3-left); }
body.rtl .q-row.c4 { border-right-color:var(--c4-left); }
body.rtl .q-text { text-align:right; }

/* ── SUBMIT ── */
.submit-area { text-align:center; margin-top:2rem; }
#submit-btn {
  background:var(--navy); color:#fff; border:none; cursor:pointer;
  font-family:inherit; font-size:.95rem; font-weight:700;
  padding:.9rem 2.8rem; border-radius:50px;
  box-shadow:var(--shadow-lg); transition:background .2s,transform .14s;
}
#submit-btn:hover { background:var(--teal); transform:translateY(-2px); }
#submit-btn.warning { background:var(--amber) !important; }
#submit-btn.warning:hover { background:#c8890e !important; }
.submit-note { font-size:.78rem; color:var(--gray-600); margin-top:.7rem; }

/* ── RESULTS ── */
#results-panel {
  display:none;
  background:var(--white); border-radius:var(--radius);
  box-shadow:var(--shadow-lg); padding:1.8rem; margin-top:1.8rem;
}
#results-panel h2 { font-family:'Fraunces',serif; font-size:1.3rem; margin-bottom:1.1rem; color:var(--navy); }
body.rtl #results-panel h2 { font-family:'Noto Sans Arabic',serif; text-align:right; }

.score-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:.85rem; margin-bottom:1.4rem; }
.score-box { border-radius:10px; padding:.9rem 1.1rem; border:1.5px solid var(--gray-200); }
body.rtl .score-box { text-align:right; }
.score-box .sn { font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--gray-600); }
body.rtl .score-box .sn { text-transform:none; letter-spacing:0; }
.score-box .sv { font-size:1.9rem; font-weight:800; color:var(--navy); margin:.15rem 0 .1rem; }
.score-box .sm { font-size:.75rem; color:var(--gray-400); }
.score-box.high { border-color:var(--red-soft); background:var(--red-light); }
.score-box.high .sv { color:var(--red-soft); }

details summary { cursor:pointer; font-weight:700; font-size:.87rem; color:var(--teal); padding:.5rem 0; }
.detail-table { width:100%; border-collapse:collapse; font-size:.8rem; margin-top:.8rem; }
.detail-table th { background:var(--gray-100); text-align:left; padding:.45rem .75rem; font-weight:700; }
body.rtl .detail-table th { text-align:right; }
.detail-table td { padding:.38rem .75rem; border-bottom:1px solid var(--gray-200); vertical-align:top; }
.detail-table tr:last-child td { border:none; }
.tag-3 { color:var(--red-soft); font-weight:700; }
.tag-2 { color:var(--amber); font-weight:600; }

.email-section { margin-top:1.4rem; }
.email-row { display:flex; gap:.7rem; align-items:flex-end; }
.email-row input { flex:1; }
#send-btn {
  background:var(--teal); color:#fff; border:none; cursor:pointer;
  font-family:inherit; font-size:.87rem; font-weight:700;
  padding:.6rem 1.3rem; border-radius:8px; white-space:nowrap;
  transition:background .18s;
}
#send-btn:hover { background:var(--navy); }
#send-status { margin-top:.7rem; font-size:.85rem; font-weight:600; display:none; }
#send-status.ok { color:var(--teal); }
#send-status.err { color:var(--red-soft); }
.print-btn {
  margin-top:1rem; background:transparent; border:1.5px solid var(--navy);
  color:var(--navy); font-family:inherit; font-size:.82rem; font-weight:700;
  padding:.45rem 1.1rem; border-radius:8px; cursor:pointer; transition:all .18s;
}
.print-btn:hover { background:var(--navy); color:#fff; }

/* ── DRUM / ROLLER DATE PICKER ── */
.dob-drums {
  display:flex; align-items:center; gap:.4rem;
  background:var(--gray-50); border:1.5px solid var(--gray-200);
  border-radius:12px; padding:.5rem .7rem;
  width:fit-content;
}
.drum-sep { font-size:1.1rem; font-weight:700; color:var(--gray-400); padding:0 .1rem; }
.drum-wrap { display:flex; flex-direction:column; align-items:center; gap:.1rem; }
.drum-wrap.drum-year { min-width:56px; }
.drum-btn {
  background:none; border:none; cursor:pointer;
  color:var(--gray-400); font-size:.68rem; padding:.08rem .35rem;
  border-radius:4px; transition:color .15s,background .15s; line-height:1;
}
.drum-btn:hover { color:var(--teal); background:var(--teal-light); }
.drum-display {
  font-size:1.15rem; font-weight:800; color:var(--navy);
  min-width:36px; text-align:center;
  background:var(--white); border:1.5px solid var(--gray-200);
  border-radius:8px; padding:.26rem .4rem;
  transition:background .15s;
}
.drum-display.flash { background:var(--teal-light); }
.drum-unit {
  font-size:.58rem; font-weight:700; text-transform:uppercase;
  letter-spacing:.05em; color:var(--gray-400);
}
body.rtl .drum-unit { letter-spacing:0; text-transform:none; }

/* ── SPECIALIST EMAIL IN SUBMIT AREA ── */
.specialist-input-wrap {
  max-width:360px; margin:0 auto .9rem; text-align:left;
}
body.rtl .specialist-input-wrap { text-align:right; }

@media print {
  #lang-bar,#progress-wrap,#missing-banner,.submit-area,.print-btn { display:none!important; }
}
</style>
</head>
<body>

<div id="lang-bar">
  <button class="lang-btn active" onclick="setLang('fr')">🇫🇷 Français</button>
  <button class="lang-btn" onclick="setLang('en')">🇬🇧 English</button>
  <button class="lang-btn" onclick="setLang('ar')">🇩🇿 العربية</button>
</div>

<header>
  <h1 data-i18n="title"></h1>
  <p data-i18n="subtitle"></p>
  <span class="badge" data-i18n="badge"></span>
</header>

<div id="progress-wrap">
  <span id="progress-label"></span>
  <div id="progress-bar-outer"><div id="progress-bar-inner"></div></div>
  <span id="progress-pct">0 %</span>
</div>

<div id="missing-banner"></div>

<main>

  <!-- INFO -->
  <div class="card">
    <div class="card-title" data-i18n="infoTitle"></div>
    <div class="info-grid">
      <div>
        <label class="field-label" for="nom" data-i18n="childName"></label>
        <input type="text" id="nom" data-i18n-ph="childNamePH">
      </div>
      <div class="dob-field" style="grid-column:1/-1">
        <label class="field-label" data-i18n="dob"></label>
        <div class="dob-drums">
          <div class="drum-wrap">
            <button class="drum-btn" onclick="drumStep('day',-1)">&#9650;</button>
            <div class="drum-display" id="drum-day">01</div>
            <button class="drum-btn" onclick="drumStep('day',1)">&#9660;</button>
            <div class="drum-unit" data-i18n="dobDay"></div>
          </div>
          <div class="drum-sep">/</div>
          <div class="drum-wrap">
            <button class="drum-btn" onclick="drumStep('month',-1)">&#9650;</button>
            <div class="drum-display" id="drum-month">01</div>
            <button class="drum-btn" onclick="drumStep('month',1)">&#9660;</button>
            <div class="drum-unit" data-i18n="dobMonth"></div>
          </div>
          <div class="drum-sep">/</div>
          <div class="drum-wrap drum-year">
            <button class="drum-btn" onclick="drumStep('year',-1)">&#9650;</button>
            <div class="drum-display" id="drum-year">2015</div>
            <button class="drum-btn" onclick="drumStep('year',1)">&#9660;</button>
            <div class="drum-unit" data-i18n="dobYear"></div>
          </div>
        </div>
      </div>
      <div>
        <label class="field-label" for="sexe" data-i18n="sex"></label>
        <select id="sexe">
          <option value="" data-i18n="sexChoose"></option>
          <option value="M" data-i18n="sexM"></option>
          <option value="F" data-i18n="sexF"></option>
        </select>
      </div>
      <div>
        <label class="field-label" for="degre" data-i18n="grade"></label>
        <input type="text" id="degre" data-i18n-ph="gradePH">
      </div>
      <div>
        <label class="field-label" for="parent-nom" data-i18n="parentName"></label>
        <input type="text" id="parent-nom" data-i18n-ph="parentNamePH">
      </div>
      <div>
        <label class="field-label" for="parent-email" data-i18n="parentEmail"></label>
        <input type="email" id="parent-email" placeholder="parent@email.com">
      </div>
    </div>
  </div>

  <!-- INSTRUCTIONS -->
  <div class="instructions">
    <strong data-i18n="instrLabel"></strong>
    <span data-i18n="instrText"></span>
    <div class="scale-legend">
      <div class="scale-chip"><span class="chip-dot" style="background:#5d8cc4"></span><strong>0</strong> — <span data-i18n="s0"></span></div>

// ══════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════
let currentLang = 'fr';
// Keep answers across language switches
const answers = {};  // answers[i] = "0"|"1"|"2"|"3" | undefined

// ══════════════════════════════════════════════════════════
// LANG
// ══════════════════════════════════════════════════════════
function setLang(lang) {
  currentLang = lang;
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==='ar' ? 'rtl' : 'ltr';
  document.body.classList.toggle('rtl', lang==='ar');

  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('onclick').includes(`'${lang}'`));
  });

  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if (t[k]!==undefined) el.textContent = t[k];
  });
  // Refresh drum labels
  document.querySelectorAll('.drum-unit[data-i18n]').forEach(el=>{
    const k=el.getAttribute('data-i18n');
    if(t[k]) el.textContent=t[k];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    const k = el.getAttribute('data-i18n-ph');
    if (t[k]) el.placeholder = t[k];
  });
  ['sexChoose','sexM','sexF'].forEach((key,i)=>{
    const opt = document.querySelectorAll('#sexe option')[i];
    if(opt && t[key]) opt.textContent = t[key];
  });

  buildQuestions();
  updateProgress();
}

// ══════════════════════════════════════════════════════════
// BUILD QUESTIONS
// ══════════════════════════════════════════════════════════
function buildQuestions() {
  const t = T[currentLang];
  const container = document.getElementById('questions-container');
  container.innerHTML = '';

  t.questions.forEach((q, idx) => {
    const num = idx + 1;

    // Section header
    if (t.sectionLabels[num]) {
      const hdr = document.createElement('div');
      hdr.className = 'section-hdr';
      hdr.innerHTML = `<span>${t.sectionLabels[num]}</span>`;
      container.appendChild(hdr);
    }

    const row = document.createElement('div');
    const colorClass = 'c' + ((num - 1) % 5);
    row.className = 'q-row ' + colorClass + (answers[num]!==undefined ? ' answered' : '');
    row.id = `row-${num}`;

    const radioHTML = [0,1,2,3].map(v => `
      <input type="radio" name="q${num}" id="q${num}v${v}" value="${v}"${answers[num]==v?' checked':''}>
      <label for="q${num}v${v}">
        <span class="r-val">${v}</span>
        <span class="r-lbl">${t.ratingLabels[v]}</span>
      </label>`).join('');

    row.innerHTML = `
      <span class="q-num">${num}</span>
      <span class="q-text">${q}</span>
      <div class="rating-group">${radioHTML}</div>`;

    container.appendChild(row);
  });
}

// ══════════════════════════════════════════════════════════
// PROGRESS + MISSING BANNER
// ══════════════════════════════════════════════════════════
function getMissing() {
  const missing = [];
  for (let i=1;i<=80;i++) {
    if (answers[i]===undefined) missing.push(i);
  }
  return missing;
}

function updateProgress() {
  const t = T[currentLang];
  const answered = 80 - getMissing().length;
  const pct = Math.round((answered/80)*100);

  document.getElementById('progress-bar-inner').style.width = pct+'%';
  document.getElementById('progress-pct').textContent = pct+' %';
  document.getElementById('progress-label').textContent = t.progressTpl(answered);
  // button always enabled — guiding logic handles missing items

  // Update row styles
  for (let i=1;i<=80;i++) {
    const row = document.getElementById(`row-${i}`);
    if (!row) continue;
    row.classList.toggle('answered', answers[i]!==undefined);
    if (answers[i]!==undefined) row.classList.remove('missing-highlight');
    // ensure colour class is preserved
    const cc = 'c'+((i-1)%5);
    if (!row.classList.contains(cc)) row.classList.add(cc);
  }

  // Missing banner — shown only if user already tried to submit
  if (window._submitAttempted) renderMissingBanner();
}

// Current missing pointer index (for sequential navigation)
let _missingPointer = 0;

function renderMissingBanner() {
  const t = T[currentLang];
  const missing = getMissing();
  const banner = document.getElementById('missing-banner');
  if (missing.length === 0) {
    banner.style.display = 'none';
    return;
  }
  banner.style.display = 'flex';
  const chips = missing.map(n =>
    `<span class="missing-chip" onclick="scrollToItem(${n})">${t.missingChip(n)}</span>`
  ).join('');
  banner.innerHTML = `<span>${t.missingBanner(missing)}</span>${chips}`;
}

function scrollToItem(num) {
  // Remove all previous highlights
  document.querySelectorAll('.missing-highlight').forEach(r => r.classList.remove('missing-highlight'));
  const row = document.getElementById(`row-${num}`);
  if (!row) return;
  row.classList.add('missing-highlight');
  // Scroll with offset to account for sticky bars
  const y = row.getBoundingClientRect().top + window.scrollY - 120;
  window.scrollTo({ top: y, behavior: 'smooth' });
  // Auto-remove highlight when answered
  const cleanup = setInterval(() => {
    if (answers[num] !== undefined) {
      row.classList.remove('missing-highlight');
      clearInterval(cleanup);
    }
  }, 300);
  // Fallback remove after 8s
  setTimeout(() => { row.classList.remove('missing-highlight'); clearInterval(cleanup); }, 8000);
}

// Listen for radio changes
document.addEventListener('change', e => {
  if (e.target.type === 'radio' && e.target.name.startsWith('q')) {
    const num = parseInt(e.target.name.slice(1));
    answers[num] = e.target.value;
    updateProgress();
    // Auto-advance to next missing item after a brief delay
    if (window._submitAttempted) {
      const missing = getMissing();
      if (missing.length > 0) {
        updateSubmitBtnState(missing.length);
        // Find next missing AFTER current item
        const next = missing.find(n => n > num);
        if (next) {
          setTimeout(() => scrollToItem(next), 350);
        }
      } else {
        updateSubmitBtnState(0);
      }
    }
  }
});

// ══════════════════════════════════════════════════════════
// SUBMIT: smart guided navigation + send
// ══════════════════════════════════════════════════════════
document.getElementById('submit-btn').addEventListener('click', () => {
  window._submitAttempted = true;
  const missing = getMissing();

  if (missing.length > 0) {
    // Find next unanswered item after current scroll position
    const scrollMid = window.scrollY + window.innerHeight / 2;
    let target = missing[0];
    for (const n of missing) {
      const row = document.getElementById(`row-${n}`);
      if (row && row.getBoundingClientRect().top + window.scrollY > scrollMid) {
        target = n; break;
      }
    }
    renderMissingBanner();
    scrollToItem(target);
    // Update button to show count + next action
    updateSubmitBtnState(missing.length);
    return;
  }

  // All answered → compute + send
  updateSubmitBtnState(0);
  computeResults();
  sendResults();
});

function updateSubmitBtnState(missingCount) {
  const t = T[currentLang];
  const btn = document.getElementById('submit-btn');
  if (missingCount > 0) {
    btn.style.background = 'var(--amber)';
    btn.textContent = t.btnMissing(missingCount);
  } else {
    btn.style.background = '';
    btn.textContent = t.calcBtn;
  }
}

// ══════════════════════════════════════════════════════════
// COMPUTE RESULTS
// ══════════════════════════════════════════════════════════
function computeResults() {
  const t = T[currentLang];
  const subscales = SUBSCALE_ITEMS[currentLang];
  const total = Object.values(answers).reduce((a,b)=>a+parseInt(b),0);
  const scoreGrid = document.getElementById('score-grid');
  scoreGrid.innerHTML = '';

  // Total box
  const maxTotal = 240;
  const b0 = document.createElement('div');
  b0.className = 'score-box'+(total > maxTotal*0.5 ? ' high' : '');
  b0.innerHTML = `<div class="sn">${t.totalScore}</div><div class="sv">${total}</div><div class="sm">/ ${maxTotal}</div>`;
  scoreGrid.appendChild(b0);

  Object.entries(subscales).forEach(([name, items]) => {
    const s = items.reduce((acc,i)=>acc+parseInt(answers[i]||0),0);
    const max = items.length*3;
    const high = s > max*0.6;
    const bx = document.createElement('div');
    bx.className = 'score-box'+(high?' high':'');
    bx.innerHTML = `<div class="sn">${name}</div><div class="sv">${s}</div><div class="sm">/ ${max}</div>`;
    scoreGrid.appendChild(bx);
  });

  // Detail table
  const wrap = document.getElementById('detail-table-wrap');
  let rows='';
  for(let i=1;i<=80;i++){
    const v=parseInt(answers[i]||0);
    const cls=v===3?'tag-3':v===2?'tag-2':'';
    rows+=`<tr><td>${i}</td><td>${t.questions[i-1]}</td><td class="${cls}">${v}</td></tr>`;
  }
  wrap.innerHTML=`<table class="detail-table">
    <thead><tr><th>${t.colItem}</th><th>${t.colDesc}</th><th>${t.colScore}</th></tr></thead>
    <tbody>${rows}</tbody></table>`;

  document.getElementById('results-panel').style.display = 'block';
  document.getElementById('results-panel').scrollIntoView({ behavior:'smooth' });
}

// ══════════════════════════════════════════════════════════
// DRUM DATE PICKER
// ══════════════════════════════════════════════════════════
const drumState = { day:1, month:1, year:2015 };
const drumMax   = { day:31, month:12, year: new Date().getFullYear() };
const drumMin   = { day:1,  month:1,  year:1990 };

function drumStep(field, dir) {
  drumState[field] += dir;
  if (drumState[field] > drumMax[field]) drumState[field] = drumMin[field];
  if (drumState[field] < drumMin[field]) drumState[field] = drumMax[field];
  const el = document.getElementById('drum-'+field);
  el.textContent = field==='year'
    ? drumState[field]
    : String(drumState[field]).padStart(2,'0');
  el.classList.add('flash');
  setTimeout(()=>el.classList.remove('flash'),200);
}

function getDOB() {
  const d = String(drumState.day).padStart(2,'0');
  const m = String(drumState.month).padStart(2,'0');
  return `${d}/${m}/${drumState.year}`;
}

// ══════════════════════════════════════════════════════════
// SEND EMAIL
// ══════════════════════════════════════════════════════════
function sendResults() {
  const t = T[currentLang];
  const specialist = document.getElementById('specialist-email').value.trim();
  const status = document.getElementById('send-status');
  status.style.display = 'none';

  if (!specialist || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(specialist)) {
    status.className='err'; status.style.display='flex'; status.style.alignItems='center'; status.style.gap='.5rem';
    status.innerHTML = '<span>'+t.errEmail+'</span>';
    status.style.display='block';
    // scroll to email field
    document.getElementById('specialist-email').focus();
    document.getElementById('specialist-email').scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }

  const info = {
    nom: document.getElementById('nom').value||'—',
    ddn: getDOB(),
    sexe: document.getElementById('sexe').value||'—',
    degre: document.getElementById('degre').value||'—',
    parentNom: document.getElementById('parent-nom').value||'—',
    parentEmail: document.getElementById('parent-email').value||'—',
  };

  const subscales = SUBSCALE_ITEMS[currentLang];
  const total = Object.values(answers).reduce((a,b)=>a+parseInt(b||0),0);

  let sub='';
  Object.entries(subscales).forEach(([name,items])=>{
    const s=items.reduce((acc,i)=>acc+parseInt(answers[i]||0),0);
    sub+=`  ${name}: ${s}/${items.length*3}\n`;
  });

  let flagged='';
  const qs = T[currentLang].questions;
  for(let i=1;i<=80;i++){
    if(parseInt(answers[i]||0)>=2)
      flagged+=`  Item ${i} (${answers[i]}/3): ${qs[i-1]}\n`;
  }

  const locale = currentLang==='ar'?'ar-DZ':currentLang==='en'?'en-GB':'fr-FR';
  const date = new Date().toLocaleDateString(locale);
  const subject = encodeURIComponent(t.emailSubject(info.nom, date));
  const body = encodeURIComponent(t.emailBody(info, sub, total, flagged));
  window.location.href = `mailto:${specialist}?subject=${subject}&body=${body}`;

  status.className='ok'; status.style.display='block';
  status.textContent = t.okEmail;
}

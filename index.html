<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questionnaire Conners</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>emailjs.init("p6Lc3MHeM0w-YeGUO");</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,400;0,600;1,400&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap');
:root{
  --navy:#1a2744;--teal:#2d7d6f;--teal-light:#e8f4f1;--teal-mid:#c2e4de;
  --amber:#e8a020;--amber-light:#fef6e8;--red-soft:#c0392b;--red-light:#fdf0ef;
  --green:#27ae60;
  --gray-50:#fafbfe;--gray-100:#f2f4f9;--gray-200:#e4e8f2;--gray-300:#c8cedf;
  --gray-400:#9aa3b8;--gray-600:#5a6478;--white:#fff;
  --shadow:0 2px 10px rgba(26,39,68,.07);--shadow-lg:0 6px 28px rgba(26,39,68,.13);
  --radius:14px;
  --c0-bg:#f0f4ff;--c0-left:#7b9fd4;--c0-num:#4a7abf;
  --c1-bg:#f0f9f4;--c1-left:#6bbf8a;--c1-num:#3d9e6a;
  --c2-bg:#fff7ed;--c2-left:#f0a045;--c2-num:#c97c10;
  --c3-bg:#fdf0f7;--c3-left:#d47bb5;--c3-num:#b0508e;
  --c4-bg:#f2f0ff;--c4-left:#8b79d4;--c4-num:#6553b8;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Inter','Noto Sans Arabic',sans-serif;background:var(--gray-100);color:var(--navy);min-height:100vh;}
body.rtl{font-family:'Noto Sans Arabic','Inter',sans-serif;}

/* ── LANG BAR ── */
#lang-bar{background:var(--navy);padding:.45rem 1rem;display:flex;justify-content:flex-end;gap:.4rem;}
.lang-btn{background:transparent;border:1.5px solid rgba(255,255,255,.3);color:rgba(255,255,255,.7);font-family:inherit;font-size:.78rem;font-weight:600;padding:.28rem .85rem;border-radius:20px;cursor:pointer;transition:all .18s;}
.lang-btn:hover,.lang-btn.active{background:var(--teal);border-color:var(--teal);color:#fff;}

/* ── PAGES ── */
.page{display:none;}
.page.active{display:block;}

/* ══════════════════════════════════
   WELCOME PAGE
══════════════════════════════════ */
.welcome-hero{background:var(--navy);color:#fff;padding:3rem 1.5rem 2.5rem;text-align:center;position:relative;overflow:hidden;}
.welcome-hero::before{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;background:rgba(45,125,111,.22);}
.welcome-hero::after{content:'';position:absolute;bottom:-40px;left:-40px;width:150px;height:150px;border-radius:50%;background:rgba(232,160,32,.16);}
.welcome-hero h1{font-family:'Fraunces',serif;font-size:1.9rem;font-weight:700;letter-spacing:-.02em;position:relative;z-index:1;line-height:1.25;}
body.rtl .welcome-hero h1{font-family:'Noto Sans Arabic',serif;letter-spacing:0;}
.welcome-hero p{margin-top:.7rem;font-size:.92rem;color:rgba(255,255,255,.72);position:relative;z-index:1;line-height:1.6;}
.welcome-badge{display:inline-block;margin-top:.8rem;background:var(--teal);color:#fff;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.3rem .9rem;border-radius:20px;position:relative;z-index:1;}
body.rtl .welcome-badge{letter-spacing:0;text-transform:none;}
.welcome-body{max-width:680px;margin:0 auto;padding:1.8rem 1rem 4rem;}
.info-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:.9rem;margin:1.4rem 0;}
.info-card{background:var(--white);border-radius:var(--radius);padding:1.1rem .9rem;text-align:center;box-shadow:var(--shadow);}
.ic-icon{font-size:1.7rem;margin-bottom:.4rem;}
.ic-title{font-size:.78rem;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.05em;}
body.rtl .ic-title{text-transform:none;letter-spacing:0;}
.ic-desc{font-size:.73rem;color:var(--gray-600);margin-top:.25rem;line-height:1.5;}
.scale-preview{background:var(--white);border-radius:var(--radius);padding:1.1rem 1.3rem;margin:1.1rem 0;box-shadow:var(--shadow);}
.scale-preview h3{font-size:.86rem;font-weight:700;color:var(--navy);margin-bottom:.7rem;}
.scale-row{display:flex;gap:.45rem;flex-wrap:wrap;}
.scale-pill{display:flex;align-items:center;gap:.35rem;font-size:.8rem;font-weight:600;padding:.3rem .85rem;border-radius:20px;color:#fff;}
.start-btn{display:block;width:100%;background:var(--navy);color:#fff;border:none;cursor:pointer;font-family:inherit;font-size:1rem;font-weight:700;padding:1rem;border-radius:50px;box-shadow:var(--shadow-lg);transition:background .2s,transform .15s;margin-top:1.4rem;text-align:center;}
.start-btn:hover{background:var(--teal);transform:translateY(-2px);}
.welcome-note{font-size:.76rem;color:var(--gray-600);text-align:center;margin-top:.85rem;line-height:1.6;}

/* ══════════════════════════════════
   FORM PAGE
══════════════════════════════════ */
header{background:var(--navy);color:#fff;padding:1.5rem 1.2rem 1.3rem;text-align:center;position:relative;overflow:hidden;}
header::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:rgba(45,125,111,.22);}
header::after{content:'';position:absolute;bottom:-30px;left:-30px;width:120px;height:120px;border-radius:50%;background:rgba(232,160,32,.16);}
header h1{font-family:'Fraunces',serif;font-size:1.4rem;font-weight:600;letter-spacing:-.02em;position:relative;z-index:1;}
body.rtl header h1{font-family:'Noto Sans Arabic',serif;letter-spacing:0;}
header p{margin-top:.3rem;font-size:.8rem;color:rgba(255,255,255,.65);position:relative;z-index:1;}
.badge{display:inline-block;margin-top:.45rem;background:var(--teal);color:#fff;font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.22rem .75rem;border-radius:20px;position:relative;z-index:1;}
body.rtl .badge{letter-spacing:0;text-transform:none;}

/* progress */
#progress-wrap{position:sticky;top:0;z-index:200;background:var(--white);box-shadow:var(--shadow);padding:.48rem .9rem;display:flex;align-items:center;gap:.75rem;}
#progress-label{font-size:.74rem;color:var(--gray-600);white-space:nowrap;min-width:82px;}
#progress-bar-outer{flex:1;height:7px;background:var(--gray-200);border-radius:8px;overflow:hidden;}
#progress-bar-inner{height:100%;width:0%;background:linear-gradient(90deg,var(--teal),var(--amber));border-radius:8px;transition:width .35s ease;}
#progress-pct{font-size:.78rem;font-weight:700;color:var(--teal);white-space:nowrap;}

/* missing banner */
#missing-banner{display:none;position:sticky;top:40px;z-index:190;background:#fff3cd;border-bottom:2px solid var(--amber);padding:.42rem .9rem;font-size:.78rem;font-weight:600;color:#7a5500;flex-wrap:wrap;gap:.4rem;}
.missing-chip{display:inline-flex;align-items:center;background:var(--amber);color:#fff;border-radius:20px;padding:.14rem .58rem;font-size:.7rem;font-weight:700;cursor:pointer;transition:opacity .15s;}
.missing-chip:hover{opacity:.82;}

/* main */
main{max-width:820px;margin:0 auto;padding:.9rem .55rem 3rem;}
@media(min-width:600px){main{padding:1.4rem 1rem 4rem;}}

/* card */
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:.85rem .8rem;margin-bottom:.9rem;}
@media(min-width:600px){.card{padding:1.3rem 1.4rem;margin-bottom:1.2rem;}}
.card-title{font-family:'Fraunces',serif;font-size:.97rem;color:var(--navy);border-left:4px solid var(--teal);padding-left:.65rem;margin-bottom:.95rem;}
body.rtl .card-title{font-family:'Noto Sans Arabic',serif;border-left:none;border-right:4px solid var(--teal);padding-left:0;padding-right:.65rem;}

/* info grid */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}
@media(max-width:480px){.info-grid{grid-template-columns:1fr;}}
.field-label{display:block;font-size:.69rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-600);margin-bottom:.22rem;}
body.rtl .field-label{text-transform:none;letter-spacing:0;}
input[type=text],input[type=email],select{width:100%;border:1.5px solid var(--gray-200);border-radius:8px;padding:.5rem .75rem;font-family:inherit;font-size:.86rem;color:var(--navy);background:var(--gray-50);outline:none;transition:border-color .18s;}
input:focus,select:focus{border-color:var(--teal);background:var(--white);}

/* drum */
.dob-drums{display:flex;align-items:center;gap:.32rem;background:var(--gray-50);border:1.5px solid var(--gray-200);border-radius:10px;padding:.42rem .65rem;width:fit-content;}
.drum-sep{font-size:.95rem;font-weight:700;color:var(--gray-400);}
.drum-wrap{display:flex;flex-direction:column;align-items:center;gap:.06rem;}
.drum-wrap.drum-year{min-width:52px;}
.drum-btn{background:none;border:none;cursor:pointer;color:var(--gray-400);font-size:.62rem;padding:.05rem .28rem;border-radius:4px;transition:color .15s,background .15s;line-height:1;}
.drum-btn:hover{color:var(--teal);background:var(--teal-light);}
.drum-display{font-size:1.05rem;font-weight:800;color:var(--navy);min-width:32px;text-align:center;background:var(--white);border:1.5px solid var(--gray-200);border-radius:7px;padding:.2rem .32rem;transition:background .15s;}
.drum-display.flash{background:var(--teal-light);}
.drum-unit{font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--gray-400);}
body.rtl .drum-unit{letter-spacing:0;text-transform:none;}

/* instructions */
.instructions{background:var(--amber-light);border-left:4px solid var(--amber);border-radius:0 10px 10px 0;padding:.8rem .95rem;margin-bottom:1.1rem;font-size:.84rem;line-height:1.65;}
body.rtl .instructions{border-left:none;border-right:4px solid var(--amber);border-radius:10px 0 0 10px;}
.scale-legend{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem;}
.scale-chip-sm{display:flex;align-items:center;gap:.28rem;font-size:.74rem;font-weight:600;background:var(--white);border:1.5px solid var(--gray-200);border-radius:20px;padding:.18rem .65rem;}
.chip-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* section hdr */
.section-hdr{display:flex;align-items:center;gap:.55rem;margin:1.2rem 0 .45rem;}
.section-hdr::before,.section-hdr::after{content:'';flex:1;height:1px;background:var(--gray-200);}
.section-hdr span{font-size:.63rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);white-space:nowrap;}
body.rtl .section-hdr span{letter-spacing:0;text-transform:none;}

/* question rows */
.q-row{display:flex;align-items:center;gap:.48rem;padding:.45rem .42rem .45rem 0;border-radius:9px;margin-bottom:2px;border-left:4px solid transparent;}
.q-row.c0{background:var(--c0-bg);border-left-color:var(--c0-left);}
.q-row.c1{background:var(--c1-bg);border-left-color:var(--c1-left);}
.q-row.c2{background:var(--c2-bg);border-left-color:var(--c2-left);}
.q-row.c3{background:var(--c3-bg);border-left-color:var(--c3-left);}
.q-row.c4{background:var(--c4-bg);border-left-color:var(--c4-left);}
.q-row.answered::after{content:'✓';font-size:.58rem;font-weight:800;color:var(--teal);opacity:.55;margin-left:auto;flex-shrink:0;}
body.rtl .q-row.answered::after{margin-left:0;margin-right:auto;}
.q-row.missing-highlight{background:#fff3cd!important;border:2px solid var(--amber)!important;border-radius:9px;animation:pw 1.2s ease infinite;}
@keyframes pw{0%,100%{box-shadow:0 0 0 2px rgba(232,160,32,.5);}50%{box-shadow:0 0 0 7px rgba(232,160,32,.12);}}
.q-num{flex-shrink:0;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:.62rem;font-weight:800;margin-left:.32rem;}
.q-row.c0 .q-num{background:var(--c0-num);color:#fff;}
.q-row.c1 .q-num{background:var(--c1-num);color:#fff;}
.q-row.c2 .q-num{background:var(--c2-num);color:#fff;}
.q-row.c3 .q-num{background:var(--c3-num);color:#fff;}
.q-row.c4 .q-num{background:var(--c4-num);color:#fff;}
.q-row.missing-highlight .q-num{background:var(--amber)!important;color:#fff;}
body.rtl .q-num{margin-left:0;margin-right:.32rem;}
.q-text{flex:1;font-size:.8rem;line-height:1.38;color:var(--navy);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0;}
.q-row:hover .q-text,.q-row:focus-within .q-text{-webkit-line-clamp:unset;overflow:visible;}
.rating-group{flex-shrink:0;display:flex;gap:.2rem;}
.rating-group input[type=radio]{display:none;}
.rating-group label{width:35px;height:35px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:7px;border:1.5px solid var(--gray-300);cursor:pointer;transition:all .13s;user-select:none;flex-shrink:0;}
.rating-group label .r-val{font-size:.82rem;font-weight:700;color:var(--gray-400);line-height:1;}
.rating-group label .r-lbl{font-size:.44rem;font-weight:600;color:var(--gray-400);margin-top:1px;text-align:center;line-height:1;white-space:nowrap;display:none;}
@media(min-width:680px){.rating-group label{width:50px;height:40px;}.rating-group label .r-lbl{display:block;}.q-text{font-size:.86rem;}}
.rating-group label:hover{border-color:var(--teal);}
.rating-group label:hover .r-val,.rating-group label:hover .r-lbl{color:var(--teal);}
.rating-group input[value="0"]:checked+label{background:#5d8cc4;border-color:#5d8cc4;}
.rating-group input[value="1"]:checked+label{background:#5aab6d;border-color:#5aab6d;}
.rating-group input[value="2"]:checked+label{background:var(--amber);border-color:var(--amber);}
.rating-group input[value="3"]:checked+label{background:var(--red-soft);border-color:var(--red-soft);}
.rating-group input:checked+label .r-val,.rating-group input:checked+label .r-lbl{color:#fff;}
body.rtl .q-row{flex-direction:row-reverse;border-left:none;border-right:4px solid transparent;}
body.rtl .q-row.c0{border-right-color:var(--c0-left);}
body.rtl .q-row.c1{border-right-color:var(--c1-left);}
body.rtl .q-row.c2{border-right-color:var(--c2-left);}
body.rtl .q-row.c3{border-right-color:var(--c3-left);}
body.rtl .q-row.c4{border-right-color:var(--c4-left);}
body.rtl .q-text{text-align:right;}

/* submit */
.submit-area{text-align:center;margin-top:1.7rem;}
.specialist-wrap{max-width:360px;margin:0 auto .8rem;text-align:left;}
body.rtl .specialist-wrap{text-align:right;}
#submit-btn{background:var(--navy);color:#fff;border:none;cursor:pointer;font-family:inherit;font-size:.95rem;font-weight:700;padding:.88rem 2.5rem;border-radius:50px;box-shadow:var(--shadow-lg);transition:background .2s,transform .14s;}
#submit-btn:hover{background:var(--teal);transform:translateY(-2px);}
.submit-note{font-size:.74rem;color:var(--gray-600);margin-top:.6rem;}

/* ══════════════════════════════════
   CONFIRMATION PAGE (parent sees only this)
══════════════════════════════════ */
#page-confirm{background:var(--gray-100);min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem;}
.confirm-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:2.5rem 2rem;max-width:480px;width:100%;text-align:center;}
.confirm-icon{font-size:4rem;margin-bottom:1rem;}
.confirm-title{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:700;color:var(--navy);margin-bottom:.7rem;}
body.rtl .confirm-title{font-family:'Noto Sans Arabic',serif;}
.confirm-msg{font-size:.92rem;color:var(--gray-600);line-height:1.7;}
.confirm-divider{height:1px;background:var(--gray-200);margin:1.4rem 0;}
.confirm-note{font-size:.78rem;color:var(--gray-400);line-height:1.6;}
.confirm-badge{display:inline-block;margin-top:1.2rem;background:var(--teal-light);color:var(--teal);font-size:.8rem;font-weight:700;padding:.45rem 1.1rem;border-radius:20px;}

@media print{#lang-bar,#progress-wrap,#missing-banner,.submit-area{display:none!important;}}
</style>
</head>
<body>

<div id="lang-bar">
  <button class="lang-btn active" onclick="setLang('fr')">🇫🇷 Français</button>
  <button class="lang-btn" onclick="setLang('en')">🇬🇧 English</button>
  <button class="lang-btn" onclick="setLang('ar')">🇩🇿 العربية</button>
</div>

<!-- ══ PAGE ACCUEIL ══ -->
<div id="page-welcome" class="page active">
  <div class="welcome-hero">
    <h1 data-i18n="wTitle"></h1>
    <p data-i18n="wSubtitle"></p>
    <span class="welcome-badge" data-i18n="badge"></span>
  </div>
  <div class="welcome-body">
    <div class="info-cards">
      <div class="info-card"><div class="ic-icon">👦</div><div class="ic-title" data-i18n="ic1T"></div><div class="ic-desc" data-i18n="ic1D"></div></div>
      <div class="info-card"><div class="ic-icon">📝</div><div class="ic-title" data-i18n="ic2T"></div><div class="ic-desc" data-i18n="ic2D"></div></div>
      <div class="info-card"><div class="ic-icon">⏱</div><div class="ic-title" data-i18n="ic3T"></div><div class="ic-desc" data-i18n="ic3D"></div></div>
      <div class="info-card"><div class="ic-icon">🔒</div><div class="ic-title" data-i18n="ic4T"></div><div class="ic-desc" data-i18n="ic4D"></div></div>
    </div>
    <div class="scale-preview">
      <h3 data-i18n="scaleTitle"></h3>
      <div class="scale-row">
        <span class="scale-pill" style="background:#5d8cc4"><strong>0</strong> — <span data-i18n="s0"></span></span>
        <span class="scale-pill" style="background:#5aab6d"><strong>1</strong> — <span data-i18n="s1"></span></span>
        <span class="scale-pill" style="background:#e8a020"><strong>2</strong> — <span data-i18n="s2"></span></span>
        <span class="scale-pill" style="background:#c0392b"><strong>3</strong> — <span data-i18n="s3"></span></span>
      </div>
    </div>
    <button class="start-btn" onclick="goToForm()" data-i18n="startBtn"></button>
    <p class="welcome-note" data-i18n="welcomeNote"></p>
  </div>
</div>

<!-- ══ PAGE FORMULAIRE ══ -->
<div id="page-form" class="page">
  <header>
    <h1 data-i18n="title"></h1>
    <p data-i18n="subtitle"></p>
    <span class="badge" data-i18n="badge"></span>
  </header>
  <div id="progress-wrap">
    <span id="progress-label"></span>
    <div id="progress-bar-outer"><div id="progress-bar-inner"></div></div>
    <span id="progress-pct">0 %</span>
  </div>
  <div id="missing-banner"></div>
  <main>
    <div class="card">
      <div class="card-title" data-i18n="infoTitle"></div>
      <div class="info-grid">
        <div><label class="field-label" data-i18n="childName"></label><input type="text" id="nom" data-i18n-ph="childNamePH"></div>
        <div class="dob-field" style="grid-column:1/-1">
          <label class="field-label" data-i18n="dob"></label>
          <div class="dob-drums">
            <div class="drum-wrap"><button class="drum-btn" onclick="drumStep('day',-1)">▲</button><div class="drum-display" id="drum-day">01</div><button class="drum-btn" onclick="drumStep('day',1)">▼</button><div class="drum-unit" data-i18n="dobDay"></div></div>
            <div class="drum-sep">/</div>
            <div class="drum-wrap"><button class="drum-btn" onclick="drumStep('month',-1)">▲</button><div class="drum-display" id="drum-month">01</div><button class="drum-btn" onclick="drumStep('month',1)">▼</button><div class="drum-unit" data-i18n="dobMonth"></div></div>
            <div class="drum-sep">/</div>
            <div class="drum-wrap drum-year"><button class="drum-btn" onclick="drumStep('year',-1)">▲</button><div class="drum-display" id="drum-year">2015</div><button class="drum-btn" onclick="drumStep('year',1)">▼</button><div class="drum-unit" data-i18n="dobYear"></div></div>
          </div>
        </div>
        <div><label class="field-label" data-i18n="sex"></label><select id="sexe"><option value="" data-i18n="sexChoose"></option><option value="M" data-i18n="sexM"></option><option value="F" data-i18n="sexF"></option></select></div>
        <div><label class="field-label" data-i18n="grade"></label><input type="text" id="degre" data-i18n-ph="gradePH"></div>
        <div><label class="field-label" data-i18n="parentName"></label><input type="text" id="parent-nom" data-i18n-ph="parentNamePH"></div>
        <div><label class="field-label" data-i18n="parentEmail"></label><input type="email" id="parent-email" placeholder="parent@email.com"></div>
      </div>
    </div>
    <div class="instructions">
      <strong data-i18n="instrLabel"></strong> <span data-i18n="instrText"></span>
      <div class="scale-legend">

function setLang(lang){
  currentLang=lang;
  const t=T[lang];
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.body.classList.toggle('rtl',lang==='ar');
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick').includes(`'${lang}'`)));
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(t[k]!==undefined)el.textContent=t[k];});
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{const k=el.getAttribute('data-i18n-ph');if(t[k])el.placeholder=t[k];});
  ['sexChoose','sexM','sexF'].forEach((key,i)=>{const o=document.querySelectorAll('#sexe option')[i];if(o&&t[key])o.textContent=t[key];});
  buildQuestions();
  updateProgress();
}

// ═══════════════════════════════════════════════════════
// QUESTIONS
// ═══════════════════════════════════════════════════════
function buildQuestions(){
  const t=T[currentLang];
  const c=document.getElementById('questions-container');
  c.innerHTML='';
  t.questions.forEach((q,idx)=>{
    const num=idx+1;
    if(t.sectionLabels[num]){const h=document.createElement('div');h.className='section-hdr';h.innerHTML=`<span>${t.sectionLabels[num]}</span>`;c.appendChild(h);}
    const row=document.createElement('div');
    const cc='c'+((num-1)%5);
    row.className='q-row '+cc+(answers[num]!==undefined?' answered':'');
    row.id=`row-${num}`;
    row.innerHTML=`<span class="q-num">${num}</span><span class="q-text">${q}</span><div class="rating-group">${[0,1,2,3].map(v=>`<input type="radio" name="q${num}" id="q${num}v${v}" value="${v}"${answers[num]==v?' checked':''}><label for="q${num}v${v}"><span class="r-val">${v}</span><span class="r-lbl">${t.ratingLabels[v]}</span></label>`).join('')}</div>`;
    c.appendChild(row);
  });
}

// ═══════════════════════════════════════════════════════
// PROGRESS
// ═══════════════════════════════════════════════════════
function getMissing(){const m=[];for(let i=1;i<=80;i++)if(answers[i]===undefined)m.push(i);return m;}
function updateProgress(){
  const t=T[currentLang];
  const answered=80-getMissing().length;
  const pct=Math.round((answered/80)*100);
  document.getElementById('progress-bar-inner').style.width=pct+'%';
  document.getElementById('progress-pct').textContent=pct+' %';
  document.getElementById('progress-label').textContent=t.progressTpl(answered);
  for(let i=1;i<=80;i++){const row=document.getElementById(`row-${i}`);if(!row)continue;row.classList.toggle('answered',answers[i]!==undefined);if(answers[i]!==undefined)row.classList.remove('missing-highlight');const cc='c'+((i-1)%5);if(!row.classList.contains(cc))row.classList.add(cc);}
  if(window._tried)renderMissingBanner();
}
function renderMissingBanner(){
  const t=T[currentLang];const missing=getMissing();const b=document.getElementById('missing-banner');
  if(missing.length===0){b.style.display='none';return;}
  b.style.display='flex';
  b.innerHTML=`<span>${t.missingBanner(missing)}</span>${missing.map(n=>`<span class="missing-chip" onclick="scrollToItem(${n})">${t.missingChip(n)}</span>`).join('')}`;
}
function scrollToItem(num){
  document.querySelectorAll('.missing-highlight').forEach(r=>r.classList.remove('missing-highlight'));
  const row=document.getElementById(`row-${num}`);if(!row)return;
  row.classList.add('missing-highlight');
  window.scrollTo({top:row.getBoundingClientRect().top+window.scrollY-130,behavior:'smooth'});
  const t=setInterval(()=>{if(answers[num]!==undefined){row.classList.remove('missing-highlight');clearInterval(t);}},300);
  setTimeout(()=>{row.classList.remove('missing-highlight');clearInterval(t);},8000);
}
document.addEventListener('change',e=>{
  if(e.target.type==='radio'&&e.target.name.startsWith('q')){
    const num=parseInt(e.target.name.slice(1));
    answers[num]=e.target.value;
    updateProgress();
    if(window._tried){
      const m=getMissing();
      if(m.length>0){updateSubmitBtn(m.length);const nx=m.find(n=>n>num);if(nx)setTimeout(()=>scrollToItem(nx),350);}
      else updateSubmitBtn(0);
    }
  }
});

// ═══════════════════════════════════════════════════════
// SUBMIT
// ═══════════════════════════════════════════════════════
document.getElementById('submit-btn').addEventListener('click',()=>{
  window._tried=true;
  const m=getMissing();
  if(m.length>0){
    const mid=window.scrollY+window.innerHeight/2;let t=m[0];
    for(const n of m){const r=document.getElementById(`row-${n}`);if(r&&r.getBoundingClientRect().top+window.scrollY>mid){t=n;break;}}
    renderMissingBanner();scrollToItem(t);updateSubmitBtn(m.length);return;
  }
  updateSubmitBtn(0);
  sendResults();
});
function updateSubmitBtn(n){
  const t=T[currentLang];const b=document.getElementById('submit-btn');
  if(n>0){b.style.background='var(--amber)';b.textContent=t.btnMissing(n);}
  else{b.style.background='';b.textContent=t.calcBtn;}
}

// ═══════════════════════════════════════════════════════
// BUILD FULL CLINICAL REPORT (for specialist email only)
// ═══════════════════════════════════════════════════════
function buildClinicalReport(info, subscales, total, date){

  const COLORS = ['#4a7abf','#3d9e6a','#c97c10','#b0508e','#6553b8','#c0392b','#0e8a8a'];
  const allItems = T[currentLang].questions;
  const maxTotal = 240;
  const pctTotal = Math.round((total / maxTotal) * 100);

  // ── Domain descriptions ──────────────────────────────────────────
  const DOMAIN_INFO = {
    "Opposition / Défiance":    { num:"D1", desc:"Évalue les comportements d'opposition, de défi et d'hostilité envers les adultes et les pairs.", items_desc:"Colère, querelles, argumentation, perte de contrôle, défiance, irritabilité, comportements mesquins." },
    "Opposition / Defiance":    { num:"D1", desc:"Assesses oppositional, defiant, and hostile behaviours toward adults and peers.", items_desc:"Anger, quarrels, arguing, loss of control, defiance, irritability, spiteful behaviours." },
    "المعارضة / العناد":         { num:"D1", desc:"يقيّم سلوكيات المعارضة والعناد والعدائية تجاه الكبار والأقران.", items_desc:"الغضب، المشاجرة، الجدال، فقدان السيطرة، التحدي، التهيج." },

    "Inattention cognitive":    { num:"D2", desc:"Évalue les difficultés attentionnelles, les erreurs d'inattention et les problèmes d'organisation dans le contexte scolaire.", items_desc:"Distraction, oublis, difficultés de concentration, désorganisation, non-achèvement des tâches." },
    "Cognitive Inattention":    { num:"D2", desc:"Assesses attentional difficulties, inattentive errors, and organisational problems in academic contexts.", items_desc:"Distraction, forgetfulness, concentration difficulties, disorganisation, task non-completion." },
    "قصور الانتباه المعرفي":     { num:"D2", desc:"يقيّم صعوبات الانتباه وأخطاء الإهمال ومشاكل التنظيم في السياق الدراسي.", items_desc:"التشتت، النسيان، صعوبات التركيز، سوء التنظيم، عدم إتمام المهام." },

    "Hyperactivité":            { num:"D3", desc:"Évalue le niveau d'agitation motrice, l'impulsivité et l'hyperactivité comportementale.", items_desc:"Agitation permanente, grimper, courir, parler excessivement, réponses impulsives, tortillements." },
    "Hyperactivity":            { num:"D3", desc:"Assesses motor restlessness, impulsivity, and behavioural hyperactivity.", items_desc:"Constant agitation, climbing, running, excessive talking, impulsive responses, squirming." },
    "فرط الحركة":               { num:"D3", desc:"يقيّم مستوى الاندفاع الحركي والتسرع وفرط النشاط السلوكي.", items_desc:"الحركة المستمرة، التسلق، الجري، الكلام المفرط، الاستجابات الاندفاعية." },

    "Anxiété / Timidité":       { num:"D4", desc:"Évalue les manifestations anxieuses, les peurs et les comportements d'inhibition sociale.", items_desc:"Timidité, peurs multiples, plaintes somatiques, rituels, attachement excessif, évitement." },
    "Anxious-Shy":              { num:"D4", desc:"Assesses anxiety manifestations, fears, and social inhibition behaviours.", items_desc:"Shyness, multiple fears, somatic complaints, rituals, excessive attachment, avoidance." },
    "القلق / الخجل":            { num:"D4", desc:"يقيّم مظاهر القلق والمخاوف وسلوكيات التثبيط الاجتماعي.", items_desc:"الخجل، المخاوف المتعددة، الشكاوى الجسدية، الطقوس، التعلق المفرط، التجنب." },

    "Perfectionnisme":          { num:"D5", desc:"Évalue la rigidité comportementale, les exigences élevées envers soi-même et les comportements de vérification.", items_desc:"Rigidité dans les exigences, vérification compulsive, objectifs très élevés, rituels de routine." },
    "Perfectionism":            { num:"D5", desc:"Assesses behavioural rigidity, high self-demands, and checking behaviours.", items_desc:"Rigid demands, compulsive checking, very high goals, routine rituals." },
    "الكمالية":                 { num:"D5", desc:"يقيّم الصرامة السلوكية والمطالب المرتفعة تجاه الذات وسلوكيات التحقق.", items_desc:"الصرامة في المطالب، التحقق القهري، الأهداف المرتفعة جداً، طقوس الروتين." },

    "Problèmes sociaux":        { num:"D6", desc:"Évalue les difficultés d'intégration sociale, les relations avec les pairs et l'isolement.", items_desc:"Absence d'amis, perte rapide de camarades, isolement, refus d'invitations, inaptitude sociale." },
    "Social Problems":          { num:"D6", desc:"Assesses social integration difficulties, peer relationships, and isolation.", items_desc:"No friends, rapid loss of peers, isolation, refusal of invitations, social ineptitude." },
    "المشكلات الاجتماعية":      { num:"D6", desc:"يقيّم صعوبات الاندماج الاجتماعي والعلاقة مع الأقران والعزلة.", items_desc:"غياب الأصدقاء، فقدان الرفاق بسرعة، العزلة، رفض الدعوات، العجز الاجتماعي." },

    "Psychosomatique":          { num:"D7", desc:"Évalue les plaintes physiques sans cause organique évidente, souvent liées au stress et à l'anxiété scolaire.", items_desc:"Maux de tête, maux d'estomac, douleurs diverses, plaintes avant l'école, fatigue inexpliquée." },
    "Psychosomatic":            { num:"D7", desc:"Assesses physical complaints without obvious organic cause, often linked to stress and school anxiety.", items_desc:"Headaches, stomach aches, various pains, complaints before school, unexplained fatigue." },
    "الشكاوى الجسدية":          { num:"D7", desc:"يقيّم الشكاوى الجسدية بدون سبب عضوي واضح، وغالباً مرتبطة بضغط الدراسة.", items_desc:"الصداع، آلام المعدة، آلام متنوعة، شكاوى قبل المدرسة، الإرهاق غير المبرر." },
  };

  // ── T-score approximation (mean=50, SD=10) ──────────────────────
  // Based on Conners 1997 normative data approximation
  function getTScore(rawScore, maxScore) {
    const pct = rawScore / maxScore;
    // Approximate T-score: T = 50 + 10 * ((pct - 0.25) / 0.15)
    const t = Math.round(50 + 10 * ((pct - 0.25) / 0.18));
    return Math.min(Math.max(t, 40), 90);
  }

  function getTInterpretation(tScore) {
    if (tScore >= 70) return { label: currentLang==='ar'?'مرتفع جداً — إشكالي':currentLang==='en'?'Very Elevated — Clinically Significant':'Très élevé — Cliniquement significatif', color:'#c0392b', zone:'danger' };
    if (tScore >= 65) return { label: currentLang==='ar'?'مرتفع — يستوجب الانتباه':currentLang==='en'?'Elevated — Warrants Attention':'Élevé — Mérite attention', color:'#e05c5c', zone:'high' };
    if (tScore >= 60) return { label: currentLang==='ar'?'فوق المتوسط':currentLang==='en'?'Above Average':'Au-dessus de la moyenne', color:'#e8a020', zone:'moderate' };
    if (tScore >= 50) return { label: currentLang==='ar'?'متوسط':currentLang==='en'?'Average':'Dans la moyenne', color:'#5aab6d', zone:'normal' };
    return { label: currentLang==='ar'?'دون المتوسط':currentLang==='en'?'Below Average':'En dessous de la moyenne', color:'#4a7abf', zone:'low' };
  }

  // ── SVG bar-gauge for each domain ───────────────────────────────
  function makeDomainGauge(rawScore, maxScore, color, tScore) {
    const pct = Math.min(Math.round((rawScore / maxScore) * 100), 100);
    const tPct = Math.min(Math.round(((tScore - 40) / 50) * 100), 100); // 40-90 range
    const threshold65Pct = Math.round(((65 - 40) / 50) * 100); // where T=65 falls
    return `
    <svg width="100%" height="28" viewBox="0 0 300 28" xmlns="http://www.w3.org/2000/svg" style="display:block">
      <!-- Background track -->
      <rect x="0" y="8" width="300" height="12" rx="6" fill="#eef0f6"/>
      <!-- Zone colors: normal (green), moderate (amber), high (red) -->
      <rect x="0" y="8" width="${threshold65Pct*3}" height="12" rx="6" fill="#e8f5ee" opacity="0.6"/>
      <rect x="${threshold65Pct*3}" y="8" width="${300-threshold65Pct*3}" height="12" rx="6" fill="#fdf0ef" opacity="0.6"/>
      <!-- Score fill -->
      <rect x="0" y="8" width="${pct*3}" height="12" rx="6" fill="${color}"/>
      <!-- T=65 threshold line -->
      <line x1="${threshold65Pct*3}" y1="4" x2="${threshold65Pct*3}" y2="24" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>
      <!-- Score label -->
      <text x="${Math.min(pct*3+4, 280)}" y="19" font-size="10" font-weight="700" fill="${color}">${rawScore}/${maxScore}</text>
      <!-- T-score label -->
      <text x="290" y="7" font-size="9" fill="#9aa3b8" text-anchor="end">T=${tScore}</text>
    </svg>`;
  }

  // ── Build per-domain cards ───────────────────────────────────────
  let domainCards = '';
  let significantCount = 0;
  let clinicalNotes = '';
  let subRows = '';
  let flaggedRows = '';

  const domainData = [];

  Object.entries(subscales).forEach(([name, items], i) => {
    const s = items.reduce((acc, j) => acc + parseInt(answers[j] || 0), 0);
    const max = items.length * 3;
    const pct = Math.round((s / max) * 100);
    const tScore = getTScore(s, max);
    const interp = getTInterpretation(tScore);
    const threshold = THRESHOLDS[name] || Math.round(max * 0.6);
    const significant = s >= threshold;
    if (significant) significantCount++;
    const info_d = DOMAIN_INFO[name] || { num: `D${i+1}`, desc: '', items_desc: '' };
    const col = COLORS[i];

    domainData.push({ name, s, max, pct, tScore, interp, significant, col, info_d, items });

    // Items in this domain with their scores
    let domainItemRows = '';
    items.forEach(itemNum => {
      const v = parseInt(answers[itemNum] || 0);
      const ibg = v===3?'#c0392b':v===2?'#e8a020':v===1?'#5aab6d':'#e4e8f2';
      const ifc = v===0?'#9aa3b8':'#fff';
      domainItemRows += `
        <tr style="background:${itemNum%2===0?'#fff':'#f8f9fc'}">
          <td style="padding:5px 8px;font-size:11px;color:#9aa3b8;font-weight:700;white-space:nowrap">${itemNum}</td>
          <td style="padding:5px 8px;font-size:11px;color:#2c3e50;line-height:1.4">${allItems[itemNum - 1]}</td>
          <td style="padding:5px 8px;text-align:center">
            <span style="display:inline-block;background:${ibg};color:${ifc};border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700">${v}</span>
          </td>
        </tr>`;
    });

    // Status badge
    const statusBadge = significant
      ? `<span style="background:#fdf0ef;color:#c0392b;border:1.5px solid #c0392b;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700">⚠ Seuil atteint — T=${tScore}</span>`
      : `<span style="background:#e8f5ee;color:#27ae60;border:1.5px solid #27ae60;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700">✓ Dans la norme — T=${tScore}</span>`;

    if (significant) {
      clinicalNotes += `<li style="margin-bottom:7px;font-size:12px;color:#2c3e50"><b>${info_d.num} — ${name}</b> : Score brut ${s}/${max} · T-score = ${tScore} · ${interp.label}. Exploration clinique recommandée.</li>`;
    }

    // Summary table row
    subRows += `
      <tr>
        <td style="padding:9px 11px;border-bottom:1px solid #e8eaf0;font-size:12px;font-weight:700;color:#1a2744">${info_d.num}</td>
        <td style="padding:9px 11px;border-bottom:1px solid #e8eaf0;font-size:12px;color:#1a2744">${name}</td>
        <td style="padding:9px 11px;border-bottom:1px solid #e8eaf0;font-size:12px;text-align:center;font-weight:700;color:${interp.color}">${s} / ${max}</td>
        <td style="padding:9px 11px;border-bottom:1px solid #e8eaf0;font-size:12px;text-align:center;font-weight:800;color:${interp.color}">${tScore}</td>
        <td style="padding:9px 11px;border-bottom:1px solid #e8eaf0;font-size:12px;color:${interp.color};font-weight:600">${interp.label}</td>
      </tr>`;

    // Full domain card
    domainCards += `
    <div style="margin-bottom:20px;border:1.5px solid #e4e8f2;border-radius:10px;overflow:hidden;border-top:4px solid ${col}">

      <!-- Domain header -->
      <div style="background:#f8f9fc;padding:12px 16px;display:flex;align-items:flex-start;gap:12px">
        <div style="background:${col};color:#fff;border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0">${info_d.num}</div>
        <div style="flex:1">
          <div style="font-size:14px;font-weight:700;color:#1a2744">${name}</div>
          <div style="font-size:11px;color:#5a6478;margin-top:3px;line-height:1.5">${info_d.desc}</div>
        </div>
        <div style="flex-shrink:0;text-align:right">${statusBadge}</div>
      </div>

      <!-- Gauge + scores -->
      <div style="padding:14px 16px;background:#fff">

        <!-- Score boxes row -->
        <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap">
          <div style="background:#f2f4f9;border-radius:8px;padding:8px 14px;text-align:center;min-width:80px">
            <div style="font-size:9px;font-weight:700;text-transform:uppercase;color:#9aa3b8;letter-spacing:.06em">Score brut</div>
            <div style="font-size:22px;font-weight:900;color:${interp.color};line-height:1.1">${s}</div>
            <div style="font-size:10px;color:#9aa3b8">/ ${max}</div>
          </div>
          <div style="background:#f2f4f9;border-radius:8px;padding:8px 14px;text-align:center;min-width:80px">
            <div style="font-size:9px;font-weight:700;text-transform:uppercase;color:#9aa3b8;letter-spacing:.06em">T-Score</div>
            <div style="font-size:22px;font-weight:900;color:${interp.color};line-height:1.1">${tScore}</div>
            <div style="font-size:10px;color:#9aa3b8">Seuil : 65</div>
          </div>
          <div style="background:#f2f4f9;border-radius:8px;padding:8px 14px;text-align:center;min-width:80px">
            <div style="font-size:9px;font-weight:700;text-transform:uppercase;color:#9aa3b8;letter-spacing:.06em">Percentile</div>
            <div style="font-size:22px;font-weight:900;color:${interp.color};line-height:1.1">${pct}</div>
            <div style="font-size:10px;color:#9aa3b8">%</div>
          </div>
          <div style="background:${significant?'#fdf0ef':'#e8f5ee'};border-radius:8px;padding:8px 14px;flex:1;min-width:120px;display:flex;align-items:center">
            <div>
              <div style="font-size:9px;font-weight:700;text-transform:uppercase;color:#9aa3b8;letter-spacing:.06em">Interprétation</div>
              <div style="font-size:12px;font-weight:700;color:${interp.color};margin-top:3px;line-height:1.4">${interp.label}</div>
            </div>
          </div>
        </div>

        <!-- Visual gauge bar -->
        <div style="margin-bottom:6px">
          <div style="font-size:10px;color:#9aa3b8;margin-bottom:4px;display:flex;justify-content:space-between">
            <span>T=40 (Bas)</span><span style="color:#c0392b">│ T=65 (Seuil clinique)</span><span>T=90 (Élevé)</span>
          </div>
          ${makeDomainGauge(s, max, interp.color, tScore)}
        </div>

        <!-- Items of this domain -->
        <details style="margin-top:10px">
          <summary style="cursor:pointer;font-size:11px;font-weight:700;color:#5a6478;padding:5px 0">${currentLang==='ar'?'عرض البنود المرتبطة بهذا المجال':currentLang==='en'?'▸ View items for this domain':'▸ Voir les items de ce domaine'} (${items.length} items)</summary>
          <table style="width:100%;border-collapse:collapse;margin-top:8px">
            <thead><tr style="background:#f2f4f9">
              <th style="padding:5px 8px;font-size:10px;font-weight:700;color:#9aa3b8;text-align:left;width:30px">#</th>
              <th style="padding:5px 8px;font-size:10px;font-weight:700;color:#9aa3b8;text-align:left">Comportement</th>
              <th style="padding:5px 8px;font-size:10px;font-weight:700;color:#9aa3b8;text-align:center;width:45px">Cote</th>
            </tr></thead>
            <tbody>${domainItemRows}</tbody>
          </table>
        </details>
      </div>
    </div>`;
  });

  // ── Flagged items ────────────────────────────────────────────────
  for (let i = 1; i <= 80; i++) {
    const v = parseInt(answers[i] || 0);
    if (v >= 2) {
      const badge = v===3 ? 'background:#c0392b' : 'background:#e8a020';
      flaggedRows += `<tr><td style="padding:6px 9px;border-bottom:1px solid #eee;font-size:11px;color:#9aa3b8;font-weight:700">${i}</td><td style="padding:6px 9px;border-bottom:1px solid #eee;font-size:11px;color:#2c3e50">${allItems[i-1]}</td><td style="padding:6px 9px;border-bottom:1px solid #eee;text-align:center"><span style="display:inline-block;${badge};color:#fff;border-radius:10px;padding:2px 9px;font-size:11px;font-weight:700">${v}/3</span></td></tr>`;
    }
  }
  if (!flaggedRows) flaggedRows = `<tr><td colspan="3" style="padding:10px;font-size:12px;color:#888;text-align:center">Aucun item coté 2 ou 3</td></tr>`;

  // ── Global interpretation ────────────────────────────────────────
  const pctTotal2 = Math.round((total / maxTotal) * 100);
  const interpGlobal = pctTotal2 > 66

// SEND — uniquement au spécialiste, rien au parent
// ═══════════════════════════════════════════════════════
function sendResults(){
  const t=T[currentLang];
  const specialist=document.getElementById('specialist-email').value.trim();
  const status=document.getElementById('send-status');
  status.style.display='none';

  if(!specialist||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(specialist)){
    status.className='';status.style.color='var(--red-soft)';status.style.display='block';
    status.textContent=t.errEmail;
    document.getElementById('specialist-email').focus();
    document.getElementById('specialist-email').scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }

  const info={
    nom:document.getElementById('nom').value||'—',
    ddn:getDOB(),
    sexe:document.getElementById('sexe').value||'—',
    degre:document.getElementById('degre').value||'—',
    parentNom:document.getElementById('parent-nom').value||'—',
    parentEmail:document.getElementById('parent-email').value||'—',
  };

  const subscales=SUBSCALE_ITEMS[currentLang];
  const total=Object.values(answers).reduce((a,b)=>a+parseInt(b||0),0);
  const locale=currentLang==='ar'?'ar-DZ':currentLang==='en'?'en-GB':'fr-FR';
  const date=new Date().toLocaleDateString(locale);

  // Build plain text subscale summary
  let subLines='';
  Object.entries(subscales).forEach(([name,items])=>{
    const s=items.reduce((acc,j)=>acc+parseInt(answers[j]||0),0);
    const max=items.length*3;
    const p=Math.round((s/max)*100);
    const thr=THRESHOLDS[name]||Math.round(max*0.6);
    subLines+=`${name}: ${s}/${max} (${p}%) ${s>=thr?'⚠ SIGNIFICATIF':''}\n`;
  });

  // Build flagged items text
  let flagged='';
  for(let i=1;i<=80;i++) if(parseInt(answers[i]||0)>=2) flagged+=`Item ${i} (${answers[i]}/3): ${T[currentLang].questions[i-1]}\n`;
  if(!flagged) flagged='Aucun item coté 2 ou 3';

  // Build full HTML report
  const html_report=buildClinicalReport(info,subscales,total,date);

  // Update button
  const btn=document.getElementById('submit-btn');
  const orig=btn.textContent;
  btn.textContent=t.sending;btn.disabled=true;

  // Send to specialist ONLY
  emailjs.send('psycholab_gmail','template_e9ua9l5',{
    to_email:   specialist,
    child_name: info.nom,
    child_dob:  info.ddn,
    child_sex:  info.sexe,
    child_grade:info.degre,
    parent_name:info.parentNom,
    parent_email:info.parentEmail,
    subscale_scores:subLines,
    total_score:`${total} / 240 (${Math.round((total/240)*100)}%)`,
    flagged_items:flagged,
    html_table: html_report,   // full clinical report in email body
    date:       date,
  })
  .then(()=>{
    btn.disabled=false;
    // ← Parent sees ONLY the confirmation page
    showPage('page-confirm');
    setLang(currentLang); // refresh i18n on confirm page
  })
  .catch(err=>{
    console.error(err);
    btn.textContent=orig;btn.disabled=false;
    status.style.color='var(--red-soft)';status.style.display='block';
    status.textContent=t.errSend;
  });
}

// DRUM DATE
// ═══════════════════════════════════════════════════════
const drumState={day:1,month:1,year:2015};
const drumMax={day:31,month:12,year:new Date().getFullYear()};
const drumMin={day:1,month:1,year:1990};
function drumStep(field,dir){
  drumState[field]+=dir;
  if(drumState[field]>drumMax[field])drumState[field]=drumMin[field];
  if(drumState[field]<drumMin[field])drumState[field]=drumMax[field];
  const el=document.getElementById('drum-'+field);
  el.textContent=field==='year'?drumState[field]:String(drumState[field]).padStart(2,'0');
  el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),200);
}
function getDOB(){return String(drumState.day).padStart(2,'0')+'/'+String(drumState.month).padStart(2,'0')+'/'+drumState.year;}

:root{
  --navy:#1a2744;--teal:#2d7d6f;--teal-light:#e8f4f1;--teal-mid:#c2e4de;
  --amber:#e8a020;--amber-light:#fef6e8;--red:#c0392b;--red-light:#fdf0ef;
  --purple:#6c3483;--purple-light:#f4ecf7;
  --blue:#2471a3;--blue-light:#eaf2fb;
  --gray-50:#fafbfe;--gray-100:#f2f4f9;--gray-200:#e4e8f2;--gray-300:#c8cedf;
  --gray-400:#9aa3b8;--gray-600:#5a6478;--white:#fff;
  --shadow:0 2px 10px rgba(26,39,68,.07);--shadow-lg:0 6px 28px rgba(26,39,68,.13);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Inter','Noto Sans Arabic',sans-serif;background:var(--gray-100);color:var(--navy);min-height:100vh;}
body.rtl{font-family:'Noto Sans Arabic','Inter',sans-serif;}
.page{display:none;} .page.active{display:block;}

/* ── LANG BAR ── */
#lang-bar{background:var(--navy);padding:.45rem 1rem;display:flex;justify-content:flex-end;gap:.4rem;}
.lang-btn{background:transparent;border:1.5px solid rgba(255,255,255,.3);color:rgba(255,255,255,.7);font-family:inherit;font-size:.78rem;font-weight:600;padding:.28rem .85rem;border-radius:20px;cursor:pointer;transition:all .18s;}
.lang-btn:hover,.lang-btn.active{background:var(--teal);border-color:var(--teal);color:#fff;}

/* ══ WELCOME ══ */
.welcome-hero{background:var(--navy);color:#fff;padding:3rem 1.5rem 2.5rem;text-align:center;position:relative;overflow:hidden;}
.welcome-hero::before{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;background:rgba(108,52,131,.3);}
.welcome-hero::after{content:'';position:absolute;bottom:-40px;left:-40px;width:150px;height:150px;border-radius:50%;background:rgba(232,160,32,.18);}
.welcome-hero h1{font-family:'Fraunces',serif;font-size:1.9rem;font-weight:700;position:relative;z-index:1;line-height:1.25;}
body.rtl .welcome-hero h1{font-family:'Noto Sans Arabic',serif;}
.welcome-hero p{margin-top:.7rem;font-size:.92rem;color:rgba(255,255,255,.72);position:relative;z-index:1;line-height:1.6;}
.welcome-badge{display:inline-block;margin-top:.8rem;background:var(--purple);color:#fff;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.3rem .9rem;border-radius:20px;position:relative;z-index:1;}
body.rtl .welcome-badge{letter-spacing:0;text-transform:none;}
.welcome-body{max-width:680px;margin:0 auto;padding:1.8rem 1rem 4rem;}
.info-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:.9rem;margin:1.4rem 0;}
.info-card{background:var(--white);border-radius:var(--radius);padding:1.1rem .9rem;text-align:center;box-shadow:var(--shadow);}
.ic-icon{font-size:1.7rem;margin-bottom:.4rem;}
.ic-title{font-size:.78rem;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.05em;}
body.rtl .ic-title{text-transform:none;letter-spacing:0;}
.ic-desc{font-size:.73rem;color:var(--gray-600);margin-top:.25rem;line-height:1.5;}
.dsm-note{background:var(--blue-light);border-left:4px solid var(--blue);border-radius:0 10px 10px 0;padding:1rem 1.2rem;margin:1.1rem 0;font-size:.84rem;line-height:1.65;color:var(--navy);}
body.rtl .dsm-note{border-left:none;border-right:4px solid var(--blue);border-radius:10px 0 0 10px;}
.start-btn{display:block;width:100%;background:var(--purple);color:#fff;border:none;cursor:pointer;font-family:inherit;font-size:1rem;font-weight:700;padding:1rem;border-radius:50px;box-shadow:var(--shadow-lg);transition:background .2s,transform .15s;margin-top:1.4rem;}
.start-btn:hover{background:var(--navy);transform:translateY(-2px);}
.welcome-note{font-size:.76rem;color:var(--gray-600);text-align:center;margin-top:.85rem;line-height:1.6;}

/* ══ FORM PAGE ══ */
header{background:var(--navy);color:#fff;padding:1.5rem 1.2rem 1.3rem;text-align:center;position:relative;overflow:hidden;}
header::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:rgba(108,52,131,.25);}
header::after{content:'';position:absolute;bottom:-30px;left:-30px;width:120px;height:120px;border-radius:50%;background:rgba(232,160,32,.16);}
header h1{font-family:'Fraunces',serif;font-size:1.4rem;font-weight:600;position:relative;z-index:1;}
body.rtl header h1{font-family:'Noto Sans Arabic',serif;}
header p{margin-top:.3rem;font-size:.8rem;color:rgba(255,255,255,.65);position:relative;z-index:1;}
.badge{display:inline-block;margin-top:.45rem;background:var(--purple);color:#fff;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.22rem .75rem;border-radius:20px;position:relative;z-index:1;}
body.rtl .badge{letter-spacing:0;text-transform:none;}

/* progress */
#progress-wrap{position:sticky;top:0;z-index:200;background:var(--white);box-shadow:var(--shadow);padding:.48rem .9rem;display:flex;align-items:center;gap:.75rem;}
#progress-label{font-size:.74rem;color:var(--gray-600);white-space:nowrap;min-width:90px;}
#progress-bar-outer{flex:1;height:7px;background:var(--gray-200);border-radius:8px;overflow:hidden;}
#progress-bar-inner{height:100%;width:0%;background:linear-gradient(90deg,var(--purple),var(--amber));border-radius:8px;transition:width .35s ease;}
#progress-pct{font-size:.78rem;font-weight:700;color:var(--purple);white-space:nowrap;}
#missing-banner{display:none;position:sticky;top:40px;z-index:190;background:#fff3cd;border-bottom:2px solid var(--amber);padding:.42rem .9rem;font-size:.78rem;font-weight:600;color:#7a5500;flex-wrap:wrap;gap:.4rem;}
.missing-chip{display:inline-flex;align-items:center;background:var(--amber);color:#fff;border-radius:20px;padding:.14rem .58rem;font-size:.7rem;font-weight:700;cursor:pointer;transition:opacity .15s;}
.missing-chip:hover{opacity:.82;}

main{max-width:860px;margin:0 auto;padding:.9rem .55rem 3rem;}
@media(min-width:600px){main{padding:1.4rem 1rem 4rem;}}

/* ── SECTION BLOCKS ── */
.section-block{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:1rem .85rem;margin-bottom:1.1rem;}
@media(min-width:600px){.section-block{padding:1.4rem 1.5rem;margin-bottom:1.3rem;}}
.section-block-title{font-family:'Fraunces',serif;font-size:1rem;color:var(--navy);margin-bottom:.85rem;display:flex;align-items:center;gap:.6rem;}
body.rtl .section-block-title{font-family:'Noto Sans Arabic',serif;}
.section-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:800;color:#fff;flex-shrink:0;}

/* info grid */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}
@media(max-width:480px){.info-grid{grid-template-columns:1fr;}}
.field-label{display:block;font-size:.69rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-600);margin-bottom:.22rem;}
body.rtl .field-label{text-transform:none;letter-spacing:0;}
input[type=text],input[type=email],input[type=number],select,textarea{width:100%;border:1.5px solid var(--gray-200);border-radius:8px;padding:.5rem .75rem;font-family:inherit;font-size:.86rem;color:var(--navy);background:var(--gray-50);outline:none;transition:border-color .18s;}
input:focus,select:focus,textarea:focus{border-color:var(--purple);background:var(--white);}
textarea{resize:vertical;min-height:70px;}

/* drum date */
.dob-drums{display:flex;align-items:center;gap:.32rem;background:var(--gray-50);border:1.5px solid var(--gray-200);border-radius:10px;padding:.42rem .65rem;width:fit-content;}
.drum-sep{font-size:.95rem;font-weight:700;color:var(--gray-400);}
.drum-wrap{display:flex;flex-direction:column;align-items:center;gap:.06rem;}
.drum-wrap.drum-year{min-width:52px;}
.drum-btn{background:none;border:none;cursor:pointer;color:var(--gray-400);font-size:.62rem;padding:.05rem .28rem;border-radius:4px;transition:color .15s,background .15s;line-height:1;}
.drum-btn:hover{color:var(--purple);background:var(--purple-light);}
.drum-display{font-size:1.05rem;font-weight:800;color:var(--navy);min-width:32px;text-align:center;background:var(--white);border:1.5px solid var(--gray-200);border-radius:7px;padding:.2rem .32rem;transition:background .15s;}
.drum-display.flash{background:var(--purple-light);}
.drum-unit{font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--gray-400);}
body.rtl .drum-unit{letter-spacing:0;text-transform:none;}

/* ── CRITERION CARDS ── */
.criterion-section-hdr{display:flex;align-items:center;gap:.6rem;margin:1.4rem 0 .6rem;}
.criterion-section-hdr::before,.criterion-section-hdr::after{content:'';flex:1;height:1.5px;background:var(--gray-200);}
.criterion-section-hdr span{font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;padding:.2rem .7rem;border-radius:20px;color:#fff;}
body.rtl .criterion-section-hdr span{letter-spacing:0;text-transform:none;}

.criterion-card{border-radius:10px;margin-bottom:.85rem;overflow:hidden;border:1.5px solid var(--gray-200);}
.criterion-header{padding:.75rem .9rem;display:flex;align-items:flex-start;gap:.7rem;cursor:pointer;user-select:none;}
.criterion-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;color:#fff;flex-shrink:0;margin-top:.1rem;}
.criterion-question{flex:1;font-size:.88rem;font-weight:600;line-height:1.45;color:var(--navy);}
body.rtl .criterion-question{text-align:right;}
.criterion-status{flex-shrink:0;font-size:.7rem;font-weight:700;padding:.18rem .65rem;border-radius:20px;white-space:nowrap;}
.criterion-body{padding:.7rem .9rem .9rem;background:var(--gray-50);display:none;}
.criterion-body.open{display:block;}

/* Age labels */
.age-cols{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
@media(max-width:540px){.age-cols{grid-template-columns:1fr;}}
.age-col{background:var(--white);border-radius:8px;padding:.7rem .8rem;border:1.5px solid var(--gray-200);}
.age-col-title{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.55rem;display:flex;align-items:center;gap:.4rem;}
body.rtl .age-col-title{letter-spacing:0;text-transform:none;flex-direction:row-reverse;}
.age-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* checkboxes */
.example-item{display:flex;align-items:flex-start;gap:.5rem;margin-bottom:.35rem;cursor:pointer;}
.example-item input[type=checkbox]{margin-top:.15rem;accent-color:var(--purple);width:14px;height:14px;flex-shrink:0;cursor:pointer;}
.example-item label{font-size:.78rem;line-height:1.45;color:var(--navy);cursor:pointer;}
body.rtl .example-item{flex-direction:row-reverse;}
body.rtl .example-item label{text-align:right;}
.other-input{margin-top:.5rem;}
.other-input input{font-size:.78rem;padding:.38rem .6rem;}

/* Present toggle */
.present-toggle{margin-top:1rem;display:flex;align-items:center;gap:.7rem;padding:.7rem .85rem;background:var(--gray-100);border-radius:10px;border:2px solid var(--gray-200);flex-wrap:wrap;position:relative;}
.present-toggle-adult{background:#eaf2fb;border-color:#2471a3;border-width:2px;}
.present-toggle-child{background:#fef6e8;border-color:var(--amber);border-width:2px;}

body.rtl .present-toggle{flex-direction:row-reverse;}
.present-toggle span{font-size:.8rem;font-weight:600;color:var(--navy);}
.present-toggle b{font-weight:800;}
.toggle-group{display:flex;gap:.35rem;}
.toggle-group input[type=radio]{display:none;}
.toggle-group label{font-size:.88rem;font-weight:700;padding:.48rem 1.1rem;border-radius:20px;border:2px solid var(--gray-300);cursor:pointer;transition:all .14s;color:var(--gray-400);user-select:none;-webkit-tap-highlight-color:transparent;min-height:44px;min-width:72px;display:flex;align-items:center;justify-content:center;}
.toggle-group label:hover{border-color:var(--purple);color:var(--purple);}
.toggle-group input[value="oui"]:checked+label{background:var(--teal);border-color:var(--teal);color:#fff;}
.toggle-group input[value="non"]:checked+label{background:#e74c3c;border-color:#e74c3c;color:#fff;}
.toggle-group input[value="0"]:checked+label{background:#5aab6d;border-color:#5aab6d;color:#fff;}
.toggle-group input[value="1"]:checked+label{background:var(--amber);border-color:var(--amber);color:#fff;}
.toggle-group input[value="2"]:checked+label{background:#c0392b;border-color:#c0392b;color:#fff;}
.toggle-group input[value="na"]:checked+label{background:var(--gray-400);border-color:var(--gray-400);color:#fff;}

/* Section C checkboxes */
.domain-section{margin-bottom:.7rem;}
.domain-title{font-size:.76rem;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem;border-bottom:1px solid var(--gray-200);padding-bottom:.3rem;}
body.rtl .domain-title{letter-spacing:0;text-transform:none;text-align:right;}

/* Yes/No questions */
.yn-row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.6rem .8rem;background:var(--white);border-radius:8px;border:1.5px solid var(--gray-200);margin-bottom:.5rem;}
body.rtl .yn-row{flex-direction:row-reverse;}
.yn-label{font-size:.83rem;font-weight:600;color:var(--navy);flex:1;line-height:1.4;}
body.rtl .yn-label{text-align:right;}

/* submit */
.submit-area{text-align:center;margin-top:1.7rem;}
.specialist-wrap{max-width:360px;margin:0 auto .8rem;text-align:left;}
body.rtl .specialist-wrap{text-align:right;}
#submit-btn{background:var(--purple);color:#fff;border:none;cursor:pointer;font-family:inherit;font-size:.95rem;font-weight:700;padding:.88rem 2.5rem;border-radius:50px;box-shadow:var(--shadow-lg);transition:background .2s,transform .14s;}
#submit-btn:hover{background:var(--navy);transform:translateY(-2px);}
.submit-note{font-size:.74rem;color:var(--gray-600);margin-top:.6rem;}
#send-status{margin-top:.6rem;font-size:.83rem;font-weight:600;display:none;}

/* ══ CONFIRM ══ */
#page-confirm{background:var(--gray-100);min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem;}
.confirm-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:2.5rem 2rem;max-width:480px;width:100%;text-align:center;}
.confirm-icon{font-size:4rem;margin-bottom:1rem;}
.confirm-title{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:700;color:var(--navy);margin-bottom:.7rem;}
body.rtl .confirm-title{font-family:'Noto Sans Arabic',serif;}
.confirm-msg{font-size:.92rem;color:var(--gray-600);line-height:1.7;}
.confirm-divider{height:1px;background:var(--gray-200);margin:1.4rem 0;}
.confirm-note{font-size:.78rem;color:var(--gray-400);line-height:1.6;}
.confirm-badge{display:inline-block;margin-top:1.2rem;background:var(--purple-light);color:var(--purple);font-size:.8rem;font-weight:700;padding:.45rem 1.1rem;border-radius:20px;}

@media print{#lang-bar,#progress-wrap,#missing-banner,.submit-area{display:none!important;}}

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fraunces:wght@400;600;700&display=swap');
:root{
  --navy:#1a2744;--purple:#6c3483;--purple-light:#f4ecf7;
  --blue:#2471a3;--blue-light:#eaf2fb;
  --teal:#2d7d6f;--teal-light:#e8f4f1;
  --amber:#e8a020;--amber-light:#fef6e8;
  --red:#c0392b;--red-light:#fdf0ef;
  --green:#27ae60;--green-light:#e8f5ee;
  --gray-100:#f2f4f9;--gray-200:#e4e8f2;--gray-400:#9aa3b8;--gray-600:#5a6478;
  --white:#fff;--shadow:0 2px 12px rgba(26,39,68,.08);--shadow-lg:0 6px 28px rgba(26,39,68,.14);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Inter',sans-serif;background:var(--gray-100);color:var(--navy);min-height:100vh;}

/* ── HEADER ── */
.rp-header{background:var(--navy);color:#fff;padding:1.5rem 1.5rem 1.2rem;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-lg);}
.rp-header-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
.rp-logo{display:flex;align-items:center;gap:.7rem;}
.rp-logo-icon{font-size:1.8rem;}
.rp-logo-text h1{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:700;}
.rp-logo-text p{font-size:.72rem;color:rgba(255,255,255,.6);margin-top:.1rem;}
.rp-actions{display:flex;gap:.5rem;flex-wrap:wrap;}
.rp-btn{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.25);color:#fff;font-family:inherit;font-size:.78rem;font-weight:600;padding:.4rem .9rem;border-radius:20px;cursor:pointer;transition:all .18s;white-space:nowrap;}
.rp-btn:hover{background:var(--purple);border-color:var(--purple);}
.rp-btn.primary{background:var(--purple);border-color:var(--purple);}

/* ── MAIN ── */
main{max-width:900px;margin:0 auto;padding:1.5rem 1rem 4rem;}

/* ── CARD ── */
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.4rem 1.5rem;margin-bottom:1.2rem;}
.card-title{font-family:'Fraunces',serif;font-size:1rem;color:var(--navy);margin-bottom:1rem;display:flex;align-items:center;gap:.5rem;border-bottom:2px solid var(--gray-200);padding-bottom:.7rem;}
.card-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;color:#fff;flex-shrink:0;}

/* ── PATIENT INFO GRID ── */
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.7rem;}
.info-cell{background:var(--gray-100);border-radius:8px;padding:.6rem .8rem;}
.info-cell-label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-400);margin-bottom:.2rem;}
.info-cell-val{font-size:.92rem;font-weight:700;color:var(--navy);}

/* ── CONCLUSION BANNER ── */
.conclusion-banner{border-radius:var(--radius);padding:1.4rem 1.5rem;margin-bottom:1.2rem;color:#fff;position:relative;overflow:hidden;}
.conclusion-banner::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.1);}
.cb-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;opacity:.75;margin-bottom:.4rem;}
.cb-subtype{font-size:1.35rem;font-weight:800;line-height:1.2;position:relative;z-index:1;}
.cb-code{font-size:.85rem;opacity:.75;margin-top:.3rem;}
.cb-summary{margin-top:.8rem;font-size:.85rem;line-height:1.6;background:rgba(255,255,255,.12);border-radius:8px;padding:.7rem 1rem;}

/* ── SCORE TILES ── */
.score-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin-bottom:1.2rem;}
@media(max-width:540px){.score-tiles{grid-template-columns:repeat(2,1fr);}}
.score-tile{border-radius:12px;padding:1rem;text-align:center;border-top:4px solid transparent;}
.score-tile .st-label{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.4rem;}
.score-tile .st-val{font-size:2.4rem;font-weight:900;line-height:1;}
.score-tile .st-max{font-size:.75rem;opacity:.6;margin-top:.2rem;}
.score-tile .st-status{font-size:.68rem;font-weight:700;margin-top:.4rem;padding:.15rem .6rem;border-radius:10px;display:inline-block;}

/* ── CHARTS ── */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.2rem;}
@media(max-width:560px){.charts-grid{grid-template-columns:1fr;}}
.chart-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.1rem;}
.chart-title{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-600);margin-bottom:.7rem;}

/* ── CRITERIA TABLE ── */
.crit-section-hdr{display:flex;align-items:center;gap:.7rem;margin:1.2rem 0 .6rem;}
.crit-section-hdr::before,.crit-section-hdr::after{content:'';flex:1;height:1.5px;background:var(--gray-200);}
.crit-section-hdr span{font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .75rem;border-radius:20px;color:#fff;white-space:nowrap;}

.crit-row{display:grid;grid-template-columns:40px 1fr 70px 70px;align-items:center;gap:.5rem;padding:.55rem .4rem;border-radius:8px;margin-bottom:2px;}
.crit-row:nth-child(even){background:var(--gray-100);}
.crit-code{font-size:.68rem;font-weight:800;color:var(--gray-400);}
.crit-q{font-size:.78rem;line-height:1.4;color:var(--navy);}
.crit-badge{display:flex;align-items:center;justify-content:center;border-radius:20px;font-size:.7rem;font-weight:700;padding:.2rem .5rem;white-space:nowrap;}
.badge-oui{background:var(--red-light);color:var(--red);border:1.5px solid var(--red);}
.badge-non{background:var(--green-light);color:var(--green);border:1.5px solid var(--green);}
.badge-nr{background:var(--gray-100);color:var(--gray-400);border:1.5px solid var(--gray-200);}

/* ── EXAMPLES ── */
.examples-list{margin-top:.4rem;padding-left:.5rem;}
.example-tag{display:inline-block;font-size:.65rem;background:#eef0f6;color:var(--gray-600);border-radius:10px;padding:.1rem .5rem;margin:.1rem .1rem;border:1px solid var(--gray-200);}
.example-tag.checked{background:var(--purple-light);color:var(--purple);border-color:var(--purple);}

/* ── SYNTHESIS ── */
.synthesis-block{background:var(--gray-100);border-radius:10px;padding:1rem 1.2rem;margin-top:.8rem;}
.synthesis-block h4{font-size:.82rem;font-weight:700;color:var(--navy);margin-bottom:.5rem;}
.synthesis-block p{font-size:.82rem;line-height:1.7;color:var(--gray-600);}

/* ── DSM TABLE ── */
.dsm-table{width:100%;border-collapse:collapse;}
.dsm-table th{background:var(--navy);color:#fff;padding:.6rem .8rem;font-size:.72rem;text-align:left;}
.dsm-table td{padding:.55rem .8rem;border-bottom:1px solid var(--gray-200);font-size:.8rem;}
.dsm-table tr:last-child td{border:none;}

/* ── PDF overlay ── */
#pdf-overlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(26,39,68,.85);align-items:center;justify-content:center;flex-direction:column;gap:1rem;color:#fff;font-size:1rem;font-weight:600;}
#pdf-overlay.show{display:flex;}
.pdf-spinner{width:44px;height:44px;border:5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── ERROR ── */
#error-page{display:none;min-height:80vh;align-items:center;justify-content:center;flex-direction:column;gap:1rem;text-align:center;padding:2rem;}
#error-page.show{display:flex;}

/* ── RAPPORT PAGE ── */
.page{display:none;}.page.active{display:block;}
</style>
</head>
<body>

<div id="lang-bar">
  <button class="lang-btn active" onclick="setLang('fr')">🇫🇷 Français</button>
  <button class="lang-btn" onclick="setLang('en')">🇬🇧 English</button>
  <button class="lang-btn" onclick="setLang('ar')">🇩🇿 العربية</button>
</div>

<!-- ══ PAGE ACCUEIL ══ -->
<div id="page-welcome" class="page active">
  <div class="welcome-hero">
    <h1 data-i18n="wTitle"></h1>
    <p data-i18n="wSubtitle"></p>
    <span class="welcome-badge" data-i18n="badge"></span>
  </div>
  <div class="welcome-body">
    <div class="info-cards">
      <div class="info-card"><div class="ic-icon">🧠</div><div class="ic-title" data-i18n="ic1T"></div><div class="ic-desc" data-i18n="ic1D"></div></div>
      <div class="info-card"><div class="ic-icon">📋</div><div class="ic-title" data-i18n="ic2T"></div><div class="ic-desc" data-i18n="ic2D"></div></div>
      <div class="info-card"><div class="ic-icon">⏱</div><div class="ic-title" data-i18n="ic3T"></div><div class="ic-desc" data-i18n="ic3D"></div></div>
      <div class="info-card"><div class="ic-icon">🔒</div><div class="ic-title" data-i18n="ic4T"></div><div class="ic-desc" data-i18n="ic4D"></div></div>
    </div>
    <div class="dsm-note" data-i18n="dsmNote"></div>
    <button class="start-btn" onclick="goToForm()" data-i18n="startBtn"></button>
    <p class="welcome-note" data-i18n="welcomeNote"></p>
  </div>
</div>

<!-- ══ PAGE FORMULAIRE ══ -->
<div id="page-form" class="page">
  <header>
    <h1 data-i18n="title"></h1>
    <p data-i18n="subtitle"></p>
    <span class="badge" data-i18n="badge"></span>
  </header>
  <div id="progress-wrap">
    <span id="progress-label"></span>
    <div id="progress-bar-outer"><div id="progress-bar-inner"></div></div>
    <span id="progress-pct">0 %</span>
  </div>
  <div id="missing-banner" style="display:none!important"></div>

  <main>

    <!-- INFO PATIENT -->
    <div class="section-block">
      <div class="section-block-title">
        <span class="section-icon" style="background:var(--purple)">👤</span>
        <span data-i18n="infoTitle"></span>
      </div>
      <div class="info-grid">
        <div><label class="field-label" data-i18n="patientName"></label><input type="text" id="nom" data-i18n-ph="patientNamePH"></div>
        <div class="dob-field" style="grid-column:1/-1">
          <label class="field-label" data-i18n="dob"></label>
          <div class="dob-drums">
            <div class="drum-wrap"><button class="drum-btn" onclick="drumStep('day',-1)">▲</button><div class="drum-display" id="drum-day">01</div><button class="drum-btn" onclick="drumStep('day',1)">▼</button><div class="drum-unit" data-i18n="dobDay"></div></div>
            <div class="drum-sep">/</div>
            <div class="drum-wrap"><button class="drum-btn" onclick="drumStep('month',-1)">▲</button><div class="drum-display" id="drum-month">01</div><button class="drum-btn" onclick="drumStep('month',1)">▼</button><div class="drum-unit" data-i18n="dobMonth"></div></div>
            <div class="drum-sep">/</div>
            <div class="drum-wrap drum-year"><button class="drum-btn" onclick="drumStep('year',-1)">▲</button><div class="drum-display" id="drum-year">1985</div><button class="drum-btn" onclick="drumStep('year',1)">▼</button><div class="drum-unit" data-i18n="dobYear"></div></div>
          </div>
        </div>
        <div><label class="field-label" data-i18n="sex"></label><select id="sexe"><option value="" data-i18n="sexChoose"></option><option value="M" data-i18n="sexM"></option><option value="F" data-i18n="sexF"></option></select></div>
        <div><label class="field-label" data-i18n="interviewDate"></label><input type="text" id="interview-date" data-i18n-ph="interviewDatePH"></div>
        <div><label class="field-label" data-i18n="clinicianName"></label><input type="text" id="clinician" data-i18n-ph="clinicianNamePH"></div>
        <div><label class="field-label" data-i18n="patientNum"></label><input type="text" id="patient-num" data-i18n-ph="patientNumPH"></div>
      </div>
    </div>

    <!-- SECTION 1: INATTENTION A1 -->
    <div class="section-block" id="section-A">
      <div class="section-block-title">
        <span class="section-icon" style="background:var(--blue)">A</span>
        <span data-i18n="secATitle"></span>
      </div>
      <p style="font-size:.8rem;color:var(--gray-600);margin-bottom:1rem;line-height:1.6" data-i18n="secAInstr"></p>
      <div id="criteria-A"></div>
    </div>

    <!-- SECTION 2: HYPERACTIVITE-IMPULSIVITE A2 -->
    <div class="section-block" id="section-HI">
      <div class="section-block-title">
        <span class="section-icon" style="background:var(--red)">HI</span>
        <span data-i18n="secHITitle"></span>
      </div>
      <p style="font-size:.8rem;color:var(--gray-600);margin-bottom:1rem;line-height:1.6" data-i18n="secHIInstr"></p>
      <div id="criteria-HI"></div>
    </div>

    <!-- SECTION 3: AGE DE DEBUT + RETENTISSEMENT -->
    <div class="section-block" id="section-B">
      <div class="section-block-title">
        <span class="section-icon" style="background:var(--amber)">B</span>
        <span data-i18n="secBTitle"></span>
      </div>

      <!-- Critère B -->
      <div style="margin-bottom:1rem">
        <div class="yn-row">
          <span class="yn-label" data-i18n="critBQ"></span>
          <div class="toggle-group">
            <input type="radio" name="critB" id="critB-oui" value="oui"><label for="critB-oui" data-i18n="yes"></label>
            <input type="radio" name="critB" id="critB-non" value="non"><label for="critB-non" data-i18n="no"></label>
          </div>
        </div>
        <div id="critB-age-wrap" style="display:none;margin-top:.5rem;display:none">
          <label class="field-label" data-i18n="critBAge"></label>
          <input type="number" id="critB-age" min="1" max="60" style="width:100px">
        </div>
      </div>

      <!-- Critère C — Retentissement -->
      <div style="margin-bottom:1rem">
        <div style="font-size:.88rem;font-weight:700;color:var(--navy);margin-bottom:.7rem" data-i18n="critCTitle"></div>
        <div id="criteria-C"></div>
      </div>

      <!-- Critère D global -->
      <div style="margin-top:1rem">
        <div class="yn-row">
          <span class="yn-label" data-i18n="critDAdult"></span>
          <div class="toggle-group">
            <input type="radio" name="critD-adult" id="critDa-oui" value="oui"><label for="critDa-oui" data-i18n="yes"></label>
            <input type="radio" name="critD-adult" id="critDa-non" value="non"><label for="critDa-non" data-i18n="no"></label>
          </div>
        </div>
        <div class="yn-row">
          <span class="yn-label" data-i18n="critDChild"></span>
          <div class="toggle-group">
            <input type="radio" name="critD-child" id="critDc-oui" value="oui"><label for="critDc-oui" data-i18n="yes"></label>
            <input type="radio" name="critD-child" id="critDc-non" value="non"><label for="critDc-non" data-i18n="no"></label>
          </div>
        </div>
      </div>

      <!-- Critère E + collatéral -->
      <div style="margin-top:1rem">
        <div class="yn-row">
          <span class="yn-label" data-i18n="critEQ"></span>
          <div class="toggle-group">
            <input type="radio" name="critE" id="critE-non" value="non"><label for="critE-non" data-i18n="no"></label>
            <input type="radio" name="critE" id="critE-oui" value="oui"><label for="critE-oui" data-i18n="yes"></label>
          </div>
        </div>
        <div id="critE-detail-wrap" style="display:none;margin-top:.4rem">
          <label class="field-label" data-i18n="critEDetail"></label>
          <input type="text" id="critE-detail">
        </div>
      </div>

      <!-- Informations collatérales -->
      <div style="margin-top:1rem">
        <div style="font-size:.82rem;font-weight:700;color:var(--navy);margin-bottom:.6rem" data-i18n="collateralTitle"></div>
        <div style="display:grid;gap:.5rem">
          <div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap">
            <span style="font-size:.78rem;flex:1" data-i18n="collParent"></span>
            <div class="toggle-group" style="margin-left:auto">
              <input type="radio" name="coll-parent" id="cp-na" value="na"><label for="cp-na">N/A</label>
              <input type="radio" name="coll-parent" id="cp-0" value="0"><label for="cp-0">0</label>
              <input type="radio" name="coll-parent" id="cp-1" value="1"><label for="cp-1">1</label>
              <input type="radio" name="coll-parent" id="cp-2" value="2"><label for="cp-2">2</label>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap">
            <span style="font-size:.78rem;flex:1" data-i18n="collPartner"></span>
            <div class="toggle-group">
              <input type="radio" name="coll-partner" id="cpa-na" value="na"><label for="cpa-na">N/A</label>
              <input type="radio" name="coll-partner" id="cpa-0" value="0"><label for="cpa-0">0</label>
              <input type="radio" name="coll-partner" id="cpa-1" value="1"><label for="cpa-1">1</label>
              <input type="radio" name="coll-partner" id="cpa-2" value="2"><label for="cpa-2">2</label>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap">
            <span style="font-size:.78rem;flex:1" data-i18n="collSchool"></span>
            <div class="toggle-group">
              <input type="radio" name="coll-school" id="cs-na" value="na"><label for="cs-na">N/A</label>
              <input type="radio" name="coll-school" id="cs-0" value="0"><label for="cs-0">0</label>
              <input type="radio" name="coll-school" id="cs-1" value="1"><label for="cs-1">1</label>
              <input type="radio" name="coll-school" id="cs-2" value="2"><label for="cs-2">2</label>
            </div>
          </div>
        </div>
        <div style="margin-top:.6rem">
          <label class="field-label" data-i18n="collDetails"></label>
          <textarea id="coll-details"></textarea>
        </div>
      </div>
    </div>

    <!-- SUBMIT -->
    <div class="submit-area">
      <div class="specialist-wrap">
        <label class="field-label" data-i18n="sendLabel"></label>
        <input type="email" id="specialist-email" placeholder="specialiste@clinique.com" style="width:100%;margin-bottom:.7rem">
      </div>
      <button id="submit-btn" data-i18n="calcBtn"></button>
      <p class="submit-note" data-i18n="submitNote"></p>
      <div id="send-status"></div>
    </div>

  </main>
</div>

// ═══════════════════════════════════════════════════════════
const drumState={day:1,month:1,year:1985};
const drumMax={day:31,month:12,year:new Date().getFullYear()-15};
const drumMin={day:1,month:1,year:1940};
function drumStep(field,dir){
  drumState[field]+=dir;
  if(drumState[field]>drumMax[field])drumState[field]=drumMin[field];
  if(drumState[field]<drumMin[field])drumState[field]=drumMax[field];
  const el=document.getElementById('drum-'+field);
  el.textContent=field==='year'?drumState[field]:String(drumState[field]).padStart(2,'0');
  el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),200);
}
function getDOB(){return String(drumState.day).padStart(2,'0')+'/'+String(drumState.month).padStart(2,'0')+'/'+drumState.year;}

function setLang(lang){
  currentLang=lang;
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.body.classList.toggle('rtl',lang==='ar');
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick').includes(`'${lang}'`)));
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(T[lang][k]!==undefined)el.textContent=T[lang][k];});
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{const k=el.getAttribute('data-i18n-ph');if(T[lang][k])el.placeholder=T[lang][k];});
  ['sexChoose','sexM','sexF'].forEach((key,i)=>{const o=document.querySelectorAll('#sexe option')[i];if(o&&T[lang][key])o.textContent=T[lang][key];});
  buildCriteria();
  buildSectionC();
  updateProgress();
}

    const color = section==='A'?'var(--blue)':'var(--red)';

    data.forEach((cr,idx)=>{
      const adultKey = cr.id+'-adult';
      const childKey = cr.id+'-child';
      const adultVal = criteriaAnswers[adultKey];
      const childVal = criteriaAnswers[childKey];
      const done = adultVal && childVal;

      const card = document.createElement('div');
      card.className = 'criterion-card';
      card.id = 'card-'+cr.id;

      const statusText = done
        ? `✓ ${adultVal==='oui'?t.yes:t.no} / ${childVal==='oui'?t.yes:t.no}`
        : '—';
      const statusColor = done ? (adultVal==='oui'||childVal==='oui'?'#c0392b':'#27ae60') : '#9aa3b8';

      // Build examples HTML for adult and child
      const makeExamples = (examples, prefix) => {
        let html = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem">
          <div style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-400)">${t.examplesLabel}</div>
          <div style="font-size:.68rem;color:var(--gray-400);font-style:italic;background:var(--gray-100);border-radius:10px;padding:.15rem .5rem">${t.optionalLabel}</div>
        </div>`;
        examples.forEach((ex,i)=>{
          const cbId = `cb-${prefix}-${i}`;
          const checked = checkedExamples[cbId]?'checked':'';
          html += `<label class="example-item"><input type="checkbox" id="${cbId}" ${checked} onchange="toggleExample('${cbId}')"><label for="${cbId}" style="font-size:.77rem;line-height:1.45;color:var(--navy)">${ex}</label></label>`;
        });
        html += `<div class="other-input"><input type="text" id="other-${prefix}" placeholder="${t.otherPH}" style="font-size:.76rem;padding:.35rem .6rem" value="${checkedExamples['other-'+prefix]||''}"></div>`;
        return html;
      };

      card.innerHTML = `
        <div class="criterion-header" onclick="toggleCard('${cr.id}')">
          <div class="criterion-num" style="background:${color}">${idx+1}</div>
          <div class="criterion-question">${cr.q}</div>
          <div class="criterion-status" style="background:${done?'#f0f9f4':'var(--gray-100)'};color:${statusColor};border:1.5px solid ${statusColor}">${statusText}</div>
        </div>
        <div class="criterion-body" id="body-${cr.id}">
          <div class="age-cols">
            <div class="age-col">
              <div class="age-col-title" style="color:var(--blue)">
                <span class="age-dot" style="background:var(--blue)"></span>

              </div>
              ${makeExamples(cr.adult, cr.id+'-adult-ex')}
              <div class="present-toggle present-toggle-adult">
                <span style="flex:1;line-height:1.5">${t.symptomPresentAdult}</span>
                <div class="toggle-group" style="flex-shrink:0">
                  <input type="radio" name="${adultKey}" id="${adultKey}-oui" value="oui" ${adultVal==='oui'?'checked':''} onchange="setCriterion('${adultKey}','oui','${cr.id}')">
                  <label for="${adultKey}-oui" onclick="setCriterion('${adultKey}','oui','${cr.id}')" style="min-width:52px;text-align:center">✓ ${t.yes}</label>
                  <input type="radio" name="${adultKey}" id="${adultKey}-non" value="non" ${adultVal==='non'?'checked':''} onchange="setCriterion('${adultKey}','non','${cr.id}')">
                  <label for="${adultKey}-non" onclick="setCriterion('${adultKey}','non','${cr.id}')" style="min-width:52px;text-align:center">✗ ${t.no}</label>
                </div>
              </div>
            </div>
            <div class="age-col">
              <div class="age-col-title" style="color:var(--amber)">
                <span class="age-dot" style="background:var(--amber)"></span>
                ${t.childLabel}
              </div>
              ${makeExamples(cr.child, cr.id+'-child-ex')}
              <div class="present-toggle present-toggle-child">
                <span style="flex:1;line-height:1.5">${t.symptomPresentChild}</span>
                <div class="toggle-group" style="flex-shrink:0">
                  <input type="radio" name="${childKey}" id="${childKey}-oui" value="oui" ${childVal==='oui'?'checked':''} onchange="setCriterion('${childKey}','oui','${cr.id}')">
                  <label for="${childKey}-oui" onclick="setCriterion('${childKey}','oui','${cr.id}')" style="min-width:52px;text-align:center">✓ ${t.yes}</label>
                  <input type="radio" name="${childKey}" id="${childKey}-non" value="non" ${childVal==='non'?'checked':''} onchange="setCriterion('${childKey}','non','${cr.id}')">
                  <label for="${childKey}-non" onclick="setCriterion('${childKey}','non','${cr.id}')" style="min-width:52px;text-align:center">✗ ${t.no}</label>
                </div>
              </div>
            </div>
          </div>
        </div>`;
      container.appendChild(card);
    });

    // Supplement question
    const supDiv = document.createElement('div');
    supDiv.style.cssText='background:var(--gray-50);border-radius:8px;padding:.7rem .9rem;margin-top:.5rem;border:1.5px solid var(--gray-200)';
    const supKey = 'sup-'+section;
    const supAdult = criteriaAnswers[supKey+'-adult'];
    const supChild = criteriaAnswers[supKey+'-child'];
    supDiv.innerHTML=`
      <div style="font-size:.78rem;color:var(--gray-600);margin-bottom:.5rem">${t['supplement'+section]}</div>
      <div style="display:flex;gap:1rem;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:.4rem;font-size:.76rem"><span>${t.adultLabel}:</span>

            <input type="radio" name="${supKey}-adult" id="${supKey}-adult-non" value="non" ${supAdult==='non'?'checked':''}><label for="${supKey}-adult-non">${t.no}</label>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:.4rem;font-size:.76rem"><span>${t.childLabel}:</span>
          <div class="toggle-group">
            <input type="radio" name="${supKey}-child" id="${supKey}-child-oui" value="oui" ${supChild==='oui'?'checked':''}><label for="${supKey}-child-oui">${t.yes}</label>
            <input type="radio" name="${supKey}-child" id="${supKey}-child-non" value="non" ${supChild==='non'?'checked':''}><label for="${supKey}-child-non">${t.no}</label>
          </div>
        </div>
      </div>`;
    container.appendChild(supDiv);
  });
}

function toggleCard(id){
  const body = document.getElementById('body-'+id);
  body.classList.toggle('open');
}
function toggleExample(id){
  checkedExamples[id] = document.getElementById(id).checked;
}
function setCriterion(key, val, cardId){
  // Prevent double-firing from both onchange and onclick
  if(criteriaAnswers[key] === val) return;
  criteriaAnswers[key] = val;
  // Check the correct radio visually
  const radio = document.querySelector(`input[name="${key}"][value="${val}"]`);
  if(radio) radio.checked = true;
  // Auto-advance: if both adult+child set, show next
  const base = key.replace('-adult','').replace('-child','');
  const otherKey = key.includes('-adult') ? base+'-child' : base+'-adult';
  if(criteriaAnswers[otherKey]){
    // Both answered — collapse after short delay
    setTimeout(()=>{
      const body = document.getElementById('body-'+base);
      if(body) body.classList.remove('open');
    }, 500);
  }
  updateProgress();
}

// BUILD SECTION C
// ═══════════════════════════════════════════════════════════
function buildSectionC(){
  const container = document.getElementById('criteria-C');
  container.innerHTML='';
  const data = SECTION_C[currentLang];
  const t = T[currentLang];

  ['adult','child'].forEach(age=>{
    const ageLabel = age==='adult'?t.adultLabel:t.childLabel;
    const ageColor = age==='adult'?'var(--blue)':'var(--amber)';
    const wrapper = document.createElement('div');
    wrapper.style.cssText=`margin-bottom:.8rem`;
    let html=`<div style="font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:${ageColor};margin-bottom:.5rem;padding:.3rem .6rem;background:${age==='adult'?'var(--blue-light)':'var(--amber-light)'};border-radius:6px;display:inline-block">${ageLabel}</div>`;
    data[age].forEach(domain=>{
      html+=`<div class="domain-section"><div class="domain-title">${domain.label}</div>`;
      domain.items.forEach((item,i)=>{
        const cbId=`sec-c-${age}-${domain.key}-${i}`;
        const checked=checkedExamples[cbId]?'checked':'';
        html+=`<label class="example-item" style="display:flex;align-items:flex-start;gap:.5rem;margin-bottom:.35rem;cursor:pointer"><input type="checkbox" id="${cbId}" ${checked} onchange="toggleExample('${cbId}')"><span style="font-size:.78rem;line-height:1.45">${item}</span></label>`;
      });
      html+=`</div>`;
    });
    wrapper.innerHTML=html;
    container.appendChild(wrapper);
  });

  // Criterion E handler
  document.addEventListener('change', e=>{
    if(e.target.name==='critE'){
      criteriaAnswers['critE']=e.target.value;
      document.getElementById('critE-detail-wrap').style.display=e.target.value==='oui'?'block':'none';
    }
    if(e.target.name==='critB'){
      criteriaAnswers['critB']=e.target.value;
      document.getElementById('critB-age-wrap').style.display=e.target.value==='non'?'block':'none';
    }
  });
}

// PROGRESS

function getMissing(){
  const missing=[];
  const allA=['A1','A2','A3','A4','A5','A6','A7','A8','A9'];
  const allHI=['HI1','HI2','HI3','HI4','HI5','HI6','HI7','HI8','HI9'];
  [...allA,...allHI].forEach(id=>{
    if(!criteriaAnswers[id+'-adult']||!criteriaAnswers[id+'-child']) missing.push(id);
  });
  return missing;
}
function updateProgress(){
  const t=T[currentLang];
  const missing=getMissing();
  const answered=18-missing.length;
  const pct=Math.round((answered/18)*100);
  document.getElementById('progress-bar-inner').style.width=pct+'%';
  document.getElementById('progress-pct').textContent=pct+' %';
  document.getElementById('progress-label').textContent=t.progressTpl(answered);
}
function renderMissingBanner(){
  const t=T[currentLang];const missing=getMissing();const b=document.getElementById('missing-banner');
  if(missing.length===0){b.style.display='none';return;}
  b.style.display='flex';
  b.innerHTML=`<span>${t.missingBanner(missing)}</span>${missing.map(n=>`<span class="missing-chip" onclick="scrollToCard('${n}')">${t.missingChip(n)}</span>`).join('')}`;
}
function scrollToCard(id){
  const card=document.getElementById('card-'+id);if(!card)return;
  document.getElementById('body-'+id).classList.add('open');
  const y=card.getBoundingClientRect().top+window.scrollY-130;
  window.scrollTo({top:y,behavior:'smooth'});
  card.style.boxShadow='0 0 0 3px var(--amber)';
  setTimeout(()=>card.style.boxShadow='',4000);
}

function sendResults(){
  const t=T[currentLang];

  status.style.display='none';

  if(!specialist||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(specialist)){
    status.style.color='var(--red)';status.style.display='block';
    status.textContent=t.errEmail;
    document.getElementById('specialist-email').focus();
    return;
  }

  const info={
    nom:document.getElementById('nom').value||'—',
    dob:getDOB(),
    sexe:document.getElementById('sexe').value||'—',
    patientNum:document.getElementById('patient-num').value||'—',
    clinician:document.getElementById('clinician').value||'—',

    lang:currentLang,

  let scoreA_adult=0,scoreA_child=0,scoreHI_adult=0,scoreHI_child=0;

  CRITERIA[currentLang].HI.forEach(cr=>{if(criteriaAnswers[cr.id+'-adult']==='oui')scoreHI_adult++;if(criteriaAnswers[cr.id+'-child']==='oui')scoreHI_child++;});

  const payload={
    info, criteriaAnswers, checkedExamples,

    critB:criteriaAnswers['critB']||'',
    critBAge:document.getElementById('critB-age').value||'',

        '<div style="font-size:30px;font-weight:900;color:'+scoreColor(scoreA_adult)+'">'+scoreA_adult+'<span style="font-size:14px;color:#9aa3b8">/9</span></div>'+
        '<div style="font-size:11px;color:'+scoreColor(scoreA_adult)+';margin-top:4px;font-weight:700">'+(scoreA_adult>=6?'⚠ Significatif':'✓ Sous le seuil')+'</div>'+

    {id:'HI5',code:'A2e',q:'Est souvent "sur la brèche" ou agit comme s\'il était "monté sur ressorts"',examples:["Toujours occupé à faire quelque chose","Déborde d'énergie, toujours en mouvement","Franchit ses propres limites","Lâche difficilement prise"]},
    {id:'HI6',code:'A2f',q:'Parle souvent trop',examples:["Parle tellement que les gens trouvent cela fatiguant","Connu pour parler de manière incessante","Ne laisse pas l'occasion aux autres d'intervenir"]},
    {id:'HI7',code:'A2g',q:'Laisse souvent échapper la réponse avant que la question soit terminée',examples:["Dit ce qu'il pense sans réfléchir","Donne des réponses avant que les gens aient fini","Finit les phrases des autres","Manque de tact"]},
    {id:'HI8',code:'A2h',q:'A souvent du mal à attendre son tour',examples:["Difficulté à attendre dans une file","Du mal à attendre son tour dans les conversations","Impatient","Commence ou termine rapidement des relations par impatience"]},
    {id:'HI9',code:'A2i',q:'Interrompt souvent les autres ou impose sa présence',examples:["Rapide à interférer avec les autres","Interrompt les autres","Dérange sans qu'on lui ait rien demandé","A une opinion sur tout et la donne immédiatement"]},
  ]
};

// ═══════════════════════════════════════════════════════
// LOAD DATA FROM URL
// ═══════════════════════════════════════════════════════
async function loadData(){
  const params = new URLSearchParams(window.location.search);

  // Primary: compact format ?d=
  const enc = params.get('d') || params.get('data');
  if(!enc){ showError(); return null; }
  try{
    const compact = JSON.parse(decodeURIComponent(escape(atob(enc))));
    // Expand compact format to full payload
    if(compact.i){
      return {
        info:{
          nom:compact.i.n||'—', dob:compact.i.d||'—', sexe:compact.i.s||'—',
          patientNum:compact.i.p||'—', clinician:compact.i.c||'—',
          interviewDate:compact.i.dt||'—', lang:compact.i.l||'fr'
        },
        criteriaAnswers: compact.a||{},
        checkedExamples: compact.ex||{},
        scores:{
          scoreA_adult:  compact.sc?compact.sc[0]:0,
          scoreA_child:  compact.sc?compact.sc[1]:0,
          scoreHI_adult: compact.sc?compact.sc[2]:0,
          scoreHI_child: compact.sc?compact.sc[3]:0,
        },
        critB:     compact.b||'',
        critBAge:  compact.ba||'',
        critDAdult:compact.da||'',
        critDChild:compact.dc||'',
        critE:     compact.e||'',
        critEDetail:compact.ed||'',
        collParent: compact.cp||'',
        collPartner:compact.cpa||'',
        collSchool: compact.cs||'',
        collDetails:compact.cd||'',
        date:      compact.ts||new Date().toISOString(),
      };
    }
    // Legacy full format
    return compact;
  }catch(e){
    console.error('loadData error:',e);
    showError(); return null;
  }
}

function showError(){
  document.getElementById('error-page').classList.add('show');
}

// ═══════════════════════════════════════════════════════
// BUILD REPORT
// ═══════════════════════════════════════════════════════
function buildReport(d){
  document.getElementById('report-page').style.display = 'block';

  const { info, criteriaAnswers, checkedExamples, scores, critB, critBAge, critDAdult, critDChild, critE, critEDetail, collParent, collPartner, collSchool, collDetails } = d;
  const { scoreA_adult, scoreA_child, scoreHI_adult, scoreHI_child } = scores;

  const locale = (info.lang||'fr')==='ar'?'ar-DZ':(info.lang==='en'?'en-GB':'fr-FR');
  const date = new Date(d.date).toLocaleDateString(locale);

  // ── Patient Info ──
  document.getElementById('rp-subtitle').textContent = `Patient : ${info.nom} — ${date}`;
  const grid = document.getElementById('patient-info-grid');
  [['Nom',info.nom],['Naissance',info.dob],['Sexe',info.sexe||'—'],['N° patient',info.patientNum||'—'],['Clinicien',info.clinician||'—'],['Date entretien',info.interviewDate||'—']].forEach(([l,v])=>{
    grid.innerHTML += `<div class="info-cell"><div class="info-cell-label">${l}</div><div class="info-cell-val">${v}</div></div>`;
  });

  // ── Subtype & conclusion ──
  const diagA = scoreA_adult >= 6;
  const diagHI = scoreHI_adult >= 6;
  const diagAc = scoreA_child >= 6;
  const diagHIc = scoreHI_child >= 6;
  const criteriaB = critB === 'oui';
  const criteriaDa = critDAdult === 'oui';
  const criteriaDc = critDChild === 'oui';
  const noOther = critE !== 'oui';

  let subtype, subtypeCode, bannerBg, synthesisText, synthesisReco;

  if((diagA || diagHI) && criteriaB && criteriaDa){
    if(diagA && diagHI){
      subtype='TDAH — Type combiné';subtypeCode='DSM-IV 314.01';
      bannerBg='linear-gradient(135deg,#6c3483,#c0392b)';
      synthesisText=`Le profil du patient présente un tableau clinique compatible avec un <strong>TDAH de type combiné (314.01)</strong>. Les critères d'inattention sont significativement atteints (${scoreA_adult}/9 à l'âge adulte, ${scoreA_child}/9 dans l'enfance) et les critères d'hyperactivité/impulsivité dépassent également le seuil clinique (${scoreHI_adult}/9 adulte, ${scoreHI_child}/9 enfance). La persistance des symptômes depuis l'enfance et le retentissement dans plusieurs domaines de vie sont documentés.`;
      synthesisReco=`Une évaluation complémentaire des comorbidités (troubles anxieux, dépressifs, troubles du sommeil) est recommandée dans ~75% des cas de TDAH adulte. Une prise en charge multimodale associant psychoéducation, stratégies comportementales et évaluation d'un traitement pharmacologique est à envisager.`;
    } else if(diagA){
      subtype='TDAH — Type inattentif prédominant';subtypeCode='DSM-IV 314.00';
      bannerBg='linear-gradient(135deg,#1a2744,#2471a3)';
      synthesisText=`Le profil présente un tableau clinique compatible avec un <strong>TDAH de type inattentif prédominant (314.00)</strong>. Les critères d'inattention sont cliniquement significatifs (${scoreA_adult}/9 adulte, ${scoreA_child}/9 enfance) alors que les critères d'hyperactivité/impulsivité restent sous le seuil (${scoreHI_adult}/9). Ce profil est souvent sous-diagnostiqué, notamment chez les femmes.`;
      synthesisReco=`Psychoéducation centrée sur les stratégies d'organisation et de gestion de l'attention. Évaluation des comorbidités anxieuses et dépressives fréquentes dans ce profil.`;
    } else {
      subtype='TDAH — Type hyperactif/impulsif prédominant';subtypeCode='DSM-IV 314.01';
      bannerBg='linear-gradient(135deg,#7b241c,#c0392b)';
      synthesisText=`Le profil présente un tableau clinique compatible avec un <strong>TDAH de type hyperactif/impulsif prédominant (314.01)</strong>. Les critères d'hyperactivité/impulsivité sont significatifs (${scoreHI_adult}/9 adulte, ${scoreHI_child}/9 enfance) tandis que les critères d'inattention restent sous le seuil diagnostique (${scoreA_adult}/9).`;
      synthesisReco=`Travail sur la gestion impulsive et les stratégies comportementales. Évaluation des troubles comorbides (opposition, troubles des conduites).`;
    }
  } else {
    subtype='Critères insuffisants pour le diagnostic de TDAH';subtypeCode='';
    bannerBg='linear-gradient(135deg,#1a2744,#2d7d6f)';
    const reasons=[];
    if(!diagA && !diagHI) reasons.push(`seuil de 6 critères non atteint (A:${scoreA_adult}/9, HI:${scoreHI_adult}/9)`);
    if(!criteriaB) reasons.push('absence de preuve de persistance depuis l\'enfance (critère B)');
    if(!criteriaDa) reasons.push('retentissement dans ≥2 domaines non confirmé (critère D)');
    synthesisText=`L'entretien DIVA 2.0 ne permet pas d'établir le diagnostic de TDAH au moment de cette évaluation. Raisons : ${reasons.join('; ')||'réponses insuffisantes pour conclure'}. Un bilan différentiel est recommandé.`;
    synthesisReco=`Envisager un diagnostic différentiel : troubles anxieux, dépressifs, troubles bipolaires, troubles du sommeil, et pathologies médicales pouvant simuler un TDAH.`;
  }

  // Conclusion banner
  document.getElementById('conclusion-banner').style.background = bannerBg;
  document.getElementById('conclusion-banner').innerHTML = `
    <div class="cb-label">CONCLUSION DIAGNOSTIQUE</div>
    <div class="cb-subtype">${subtype}</div>
    ${subtypeCode?`<div class="cb-code">${subtypeCode}</div>`:''}
    <div class="cb-summary">${synthesisText}</div>`;

  // ── Score tiles ──
  const tiles = [
    {label:'Inattention Adulte',val:scoreA_adult,max:9,color:'#2471a3',bg:'#eaf2fb'},
    {label:'HI Adulte',val:scoreHI_adult,max:9,color:'#c0392b',bg:'#fdf0ef'},
    {label:'Inattention Enfance',val:scoreA_child,max:9,color:'#e8a020',bg:'#fef6e8'},
    {label:'HI Enfance',val:scoreHI_child,max:9,color:'#6c3483',bg:'#f4ecf7'},
  ];
  const tilesEl = document.getElementById('score-tiles');
  tiles.forEach(({label,val,max,color,bg})=>{
    const sig = val >= 6;
    tilesEl.innerHTML += `
      <div class="score-tile" style="background:${bg};border-top-color:${color}">
        <div class="st-label" style="color:${color}">${label}</div>
        <div class="st-val" style="color:${sig?'#c0392b':color}">${val}</div>
        <div class="st-max">/ ${max} critères</div>
        <div class="st-status" style="background:${sig?'#fdf0ef':'#e8f5ee'};color:${sig?'#c0392b':'#27ae60'}">${sig?'⚠ ≥6 Significatif':'✓ Sous le seuil'}</div>
      </div>`;
  });

  // ── Bar chart ──
  const barLabels=['Inattention\nAdulte','HI\nAdulte','Inattention\nEnfance','HI\nEnfance'];
  const barVals=[scoreA_adult,scoreHI_adult,scoreA_child,scoreHI_child];
  const barColors=['#2471a3','#c0392b','#e8a020','#6c3483'];
  new Chart(document.getElementById('chart-bar').getContext('2d'),{
    type:'bar',
    data:{labels:barLabels,datasets:[{data:barVals,backgroundColor:barColors,borderRadius:8,borderSkipped:false}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.raw}/9`}}},
      scales:{y:{min:0,max:9,ticks:{stepSize:1},grid:{color:'#eef0f6'},
        plugins:{annotation:{annotations:{threshold:{type:'line',yMin:6,yMax:6,borderColor:'#c0392b',borderWidth:2,borderDash:[4,4]}}}}},
        x:{ticks:{font:{size:10}}}}}
  });

  // ── Radar chart ──
  new Chart(document.getElementById('chart-radar').getContext('2d'),{
    type:'radar',
    data:{labels:barLabels,datasets:[
      {label:'Adulte',data:[scoreA_adult,scoreHI_adult,scoreA_adult,scoreHI_adult],backgroundColor:'rgba(108,52,131,.15)',borderColor:'#6c3483',borderWidth:2,pointBackgroundColor:'#6c3483',pointRadius:4},
      {label:'Enfance',data:[scoreA_child,scoreHI_child,scoreA_child,scoreHI_child],backgroundColor:'rgba(232,160,32,.12)',borderColor:'#e8a020',borderWidth:2,borderDash:[4,3],pointBackgroundColor:'#e8a020',pointRadius:4},
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11}}}},
      scales:{r:{min:0,max:9,ticks:{stepSize:3,font:{size:9}},pointLabels:{font:{size:9}}}}}
  });

  // ── Comparison bar chart (per-criterion adult vs child) ──
  const allCritIds = [...CRIT_LABELS.A,...CRIT_LABELS.HI].map(c=>c.code);
  const adultVals2 = [...CRIT_LABELS.A,...CRIT_LABELS.HI].map(cr=>criteriaAnswers[cr.id+'-adult']==='oui'?1:0);
  const childVals2 = [...CRIT_LABELS.A,...CRIT_LABELS.HI].map(cr=>criteriaAnswers[cr.id+'-child']==='oui'?1:0);
  new Chart(document.getElementById('chart-compare').getContext('2d'),{
    type:'bar',
    data:{labels:allCritIds,datasets:[
      {label:'Adulte',data:adultVals2,backgroundColor:'rgba(108,52,131,.75)',borderRadius:4},
      {label:'Enfance',data:childVals2,backgroundColor:'rgba(232,160,32,.75)',borderRadius:4},
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11}}}},
      scales:{y:{min:0,max:1,ticks:{callback:v=>v===1?'Oui':v===0?'Non':'',stepSize:1},grid:{color:'#eef0f6'}},x:{ticks:{font:{size:9}}}}}
  });

  // ── DSM-IV table ──
  const dsmTable = document.getElementById('dsm-table');
  const dsmRows=[
    ['Critère A — Inattention adulte ≥ 6',scoreA_adult>=6,`${scoreA_adult}/9`],
    ['Critère A — Hyperactivité/Impulsivité adulte ≥ 6',scoreHI_adult>=6,`${scoreHI_adult}/9`],
    ['Critère A — Inattention enfance ≥ 6',scoreA_child>=6,`${scoreA_child}/9`],
    ['Critère A — Hyperactivité/Impulsivité enfance ≥ 6',scoreHI_child>=6,`${scoreHI_child}/9`],
    ['Critère B — Persistance vie entière (avant 7 ans)',critB==='oui', critB==='oui'?'Oui':critBAge?`Non — début à ${critBAge} ans`:'Non renseigné'],
    ['Critère C/D — Retentissement adulte ≥ 2 domaines',critDAdult==='oui',critDAdult||'—'],
    ['Critère C/D — Retentissement enfance ≥ 2 domaines',critDChild==='oui',critDChild||'—'],
    ['Critère E — Non expliqué par autre diagnostic',critE!=='oui', critE==='oui'?`Oui — ${critEDetail||'non précisé'}`:'Non'],
  ];
  dsmTable.innerHTML = `<thead><tr><th>Critère DSM-IV</th><th style="text-align:center;width:100px">Satisfait</th><th style="width:160px">Valeur</th></tr></thead><tbody>`+
    dsmRows.map(([label,met,val],i)=>`
      <tr style="background:${i%2===0?'#fff':'#f8f9fc'}">
        <td style="font-size:.8rem;color:#2c3e50">${label}</td>
        <td style="text-align:center"><span style="display:inline-block;background:${met?'#e8f5ee':'#fdf0ef'};color:${met?'#27ae60':'#c0392b'};border:1.5px solid ${met?'#27ae60':'#c0392b'};border-radius:20px;padding:.18rem .6rem;font-size:.72rem;font-weight:700">${met?'✓ Oui':'✗ Non'}</span></td>
        <td style="font-size:.78rem;color:#5a6478">${val}</td>
      </tr>`).join('')+'</tbody>';

  // ── Synthesis card ──
  const collScore = n=>n==='2'?'Net (2)':n==='1'?'Partiel (1)':n==='0'?'Faible (0)':n==='na'?'N/A':'—';
  document.getElementById('synthesis-content').innerHTML = `
    <div class="synthesis-block">
      <h4>📝 Synthèse des résultats</h4>
      <p>${synthesisText}</p>
    </div>
    <div class="synthesis-block" style="margin-top:.7rem;background:${subtype.includes('insuffisants')?'#e8f5ee':'#fdf0ef'}">
      <h4>💡 Recommandations cliniques</h4>
      <p>${synthesisReco}</p>
    </div>
    <div class="synthesis-block" style="margin-top:.7rem">
      <h4>📎 Informations collatérales</h4>
      <p>
        <strong>Famille :</strong> ${collScore(collParent)} &nbsp;|&nbsp;
        <strong>Partenaire :</strong> ${collScore(collPartner)} &nbsp;|&nbsp;
        <strong>Livrets scolaires :</strong> ${collScore(collSchool)}<br>
        ${collDetails?`<em>${collDetails}</em>`:''}
      </p>
    </div>`;

  // ── Criteria detail ──
  ['A','HI'].forEach(section=>{
    const container = document.getElementById('detail-'+section);
    const color = section==='A'?'#2471a3':'#c0392b';
    CRIT_LABELS[section].forEach((cr,idx)=>{
      const av = criteriaAnswers[cr.id+'-adult'];
      const cv = criteriaAnswers[cr.id+'-child'];
      // Checked adult examples
      const checkedAdult = cr.examples.map((ex,i)=>{
        const k=`cb-${cr.id}-adult-ex-${i}`;
        return {ex, checked: !!checkedExamples[k]};
      });
      const checkedChild = cr.examples.map((ex,i)=>{
        const k=`cb-${cr.id}-child-ex-${i}`;
        return {ex, checked: !!checkedExamples[k]};
      });
      const aBadge = av==='oui'?'badge-oui':av==='non'?'badge-non':'badge-nr';
      const cBadge = cv==='oui'?'badge-oui':cv==='non'?'badge-non':'badge-nr';
      const aText = av==='oui'?'Oui ✓':av==='non'?'Non ✗':'N/R';
      const cText = cv==='oui'?'Oui ✓':cv==='non'?'Non ✗':'N/R';

      container.innerHTML += `
        <div style="padding:.6rem .4rem;border-bottom:1px solid var(--gray-200)">
          <div class="crit-row" style="grid-template-columns:40px 1fr 70px 70px">
            <span class="crit-code" style="color:${color}">${cr.code}</span>
            <span class="crit-q">${cr.q}</span>
            <span class="crit-badge ${aBadge}">${aText}</span>
            <span class="crit-badge ${cBadge}">${cText}</span>
          </div>
          <div style="padding:0 .4rem;margin-top:.3rem;display:flex;gap:.5rem;flex-wrap:wrap">
            <div style="flex:1;min-width:140px">
              <div style="font-size:.62rem;font-weight:700;text-transform:uppercase;color:#2471a3;margin-bottom:.25rem">Adulte — exemples cochés</div>
              ${checkedAdult.filter(e=>e.checked).length===0
                ? '<span style="font-size:.7rem;color:var(--gray-400);font-style:italic">Aucun exemple coché</span>'
                : checkedAdult.filter(e=>e.checked).map(e=>`<span class="example-tag checked">${e.ex}</span>`).join('')}
            </div>
            <div style="flex:1;min-width:140px">
              <div style="font-size:.62rem;font-weight:700;text-transform:uppercase;color:#e8a020;margin-bottom:.25rem">Enfance — exemples cochés</div>
              ${checkedChild.filter(e=>e.checked).length===0
                ? '<span style="font-size:.7rem;color:var(--gray-400);font-style:italic">Aucun exemple coché</span>'
                : checkedChild.filter(e=>e.checked).map(e=>`<span class="example-tag checked">${e.ex}</span>`).join('')}
            </div>
          </div>
        </div>`;
    });
    // Column headers
    container.insertAdjacentHTML('afterbegin',`
      <div style="display:grid;grid-template-columns:40px 1fr 70px 70px;gap:.5rem;padding:.4rem;border-bottom:2px solid var(--gray-200);margin-bottom:.3rem">
        <span style="font-size:.65rem;font-weight:700;color:var(--gray-400)">Code</span>
        <span style="font-size:.65rem;font-weight:700;color:var(--gray-400)">Critère</span>
        <span style="font-size:.65rem;font-weight:700;color:#2471a3;text-align:center">Adulte</span>
        <span style="font-size:.65rem;font-weight:700;color:#e8a020;text-align:center">Enfance</span>
      </div>`);
  });
}

// PDF
// ═══════════════════════════════════════════════════════
async function downloadPDF(){
  const overlay=document.getElementById('pdf-overlay');
  overlay.classList.add('show');
  await new Promise(r=>setTimeout(r,400));
  try{
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const pageW=210,margin=10,contentW=pageW-margin*2;
    const canvas=await html2canvas(document.getElementById('report-content'),{
      scale:1.8,useCORS:true,backgroundColor:'#f2f4f9',windowWidth:900
    });
    const imgH=(canvas.height*contentW)/canvas.width;
    const pageH=297-margin*2;
    let remaining=imgH;
    while(remaining>0){
      const sliceH=Math.min(remaining,pageH);
      const sy=(imgH-remaining)/imgH*canvas.height;
      const sc=document.createElement('canvas');
      sc.width=canvas.width; sc.height=(sliceH/imgH)*canvas.height;
      sc.getContext('2d').drawImage(canvas,0,sy,canvas.width,sc.height,0,0,canvas.width,sc.height);
      if(imgH-remaining>0) pdf.addPage();
      pdf.addImage(sc.toDataURL('image/jpeg',.88),'JPEG',margin,margin,contentW,sliceH);
      remaining-=sliceH;
    }
    const nom = document.querySelector('.info-cell-val')?.textContent||'patient';
    pdf.save(`DIVA2_${nom}_${new Date().toISOString().slice(0,10)}.pdf`);
  }catch(e){console.error(e);alert('Erreur PDF. Utilisez Imprimer.');}
  overlay.classList.remove('show');
}

// Auto-show rapport if ?data= param present in URL
async function checkRapportMode(){
  const params = new URLSearchParams(window.location.search);
  if(params.get('d') || params.get('data')){
    const lb = document.getElementById('lang-bar');
    if(lb) lb.style.display='none';
    showPage('page-rapport');
    // Show loading indicator
    const rc = document.getElementById('report-content');
    if(rc) rc.innerHTML = '<div style="text-align:center;padding:4rem 1rem;color:#6c3483"><div style="font-size:2.5rem;margin-bottom:1rem">⏳</div><div style="font-size:1rem;font-weight:600">Chargement du rapport...</div></div>';
    const data = await loadData();
    if(data){ if(rc) rc.innerHTML=''; buildReport(data); }
  }
}
checkRapportMode();
